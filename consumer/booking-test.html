<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maraVilla Booking Test</title>
</head>
<body>

<!-- maraVilla Booking Test (Airbnb-lite) — v1.1 UI polish -->

<div id="mv-app" class="mv-app">
    <div class="mv-search">
        <div class="mv-field mv-field--hidden">
            <label>Check-in</label>
            <input id="mvCheckin" type="date" />
        </div>

        <div class="mv-field mv-field--hidden">
            <label>Check-out</label>
            <input id="mvCheckout" type="date" />
        </div>

        <div class="mv-field">
            <label>Dates</label>
            <div class="mv-date-wrapper">
                <button id="mvDatesBtn" class="mv-date-display" type="button">Add dates</button>
                <button id="mvDatesClear" class="mv-date-clear" type="button" aria-label="Clear dates">×</button>
            </div>
        </div>

        <div class="mv-field">
            <label>Guests</label>
            <select id="mvGuests">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
        </div>

        <button id="mvSearchBtn" class="mv-btn mv-btn--primary" type="button">Check availability</button>
    </div>
<div id="availabilityStatus" style="margin-top:8px;font-weight:bold;"></div>
<div id="availabilityPrice" style="margin-top:4px;"></div>
<div id="mvCurrencyNote" style="margin-top:6px;font-size:12px;opacity:.75;">Prices are shown in each property's listed currency.</div>

    <div class="mv-subrow">
        <div id="mvMsg" class="mv-msg"></div>
        <div class="mv-right">
            <button id="mvShowSaved" class="mv-btn mv-btn--ghost" type="button">Saved</button>
            <button id="mvShowAll" class="mv-btn mv-btn--ghost" type="button">Show all</button>
        </div>
    </div>

    <div id="mvResults" class="mv-grid"></div>
</div>

<!-- UX1: dedicated property view (same document; shown instead of #mv-app on /property/:id). Non-bookable at this stage. -->
<div id="mvPropertyView" class="mv-prop mv-view-hidden" aria-live="polite"></div>

<!-- UX2b: full-screen photo viewer for the property view. Separate from the booking modal and calendar (own ids, own key handling). -->
<!-- UX4b: property-page date editor (second calendar host; own mvPdCal* ids, own draft state). Inner calendar DOM is rebuilt on every open. -->
<div id="mvPdCal" class="mv-pdcal" aria-hidden="true" hidden>
    <div class="mv-pdcal__backdrop" data-pdcal-close="1"></div>
    <div id="mvPdCalPanel" class="mv-pdcal__panel mv-hcal" role="dialog" aria-modal="true" aria-labelledby="mvPdCalTitle" tabindex="-1">
        <div class="mv-pdcal__header">
            <div>
                <div id="mvPdCalTitle" class="mv-pdcal__title">Select dates</div>
                <div id="mvPdCalSummary" class="mv-pdcal__summary"></div>
            </div>
            <button id="mvPdCalClose" class="mv-calendar__close" type="button" aria-label="Close date editor">✕</button>
        </div>
        <div id="mvPdCalBody" class="mv-pdcal__body"></div>
        <div class="mv-pdcal__footer">
            <button id="mvPdCalClear" class="mv-btn mv-btn--ghost" type="button">Clear dates</button>
            <button id="mvPdCalApply" class="mv-btn mv-btn--primary" type="button">Apply dates</button>
        </div>
    </div>
</div>

<div id="mvGallery" class="mv-gallery" aria-hidden="true" hidden>
    <div id="mvGalleryPanel" class="mv-gallery__panel" role="dialog" aria-modal="true" aria-labelledby="mvGalleryTitle" tabindex="-1">
        <div class="mv-gallery__bar">
            <button id="mvGalleryClose" class="mv-gallery__close" type="button" aria-label="Close photos">✕ Close</button>
            <div id="mvGalleryTitle" class="mv-gallery__title"></div>
            <div id="mvGalleryCount" class="mv-gallery__count" aria-hidden="true"></div>
        </div>
        <div id="mvGalleryLive" class="mv-gallery__sr" aria-live="polite"></div>
        <div id="mvGalleryStage" class="mv-gallery__stage">
            <button id="mvGalleryPrev" class="mv-gallery__nav mv-gallery__nav--prev" type="button" aria-label="Previous photo">&#8249;</button>
            <figure class="mv-gallery__figure">
                <img id="mvGalleryImg" class="mv-gallery__img" alt="" decoding="async">
                <div id="mvGalleryError" class="mv-gallery__error" hidden>This photo could not be loaded.</div>
            </figure>
            <button id="mvGalleryNext" class="mv-gallery__nav mv-gallery__nav--next" type="button" aria-label="Next photo">&#8250;</button>
        </div>
    </div>
</div>

<div id="mvModal" class="mv-modal" aria-hidden="true">
    <div class="mv-modal__backdrop" data-close="1"></div>
    <div class="mv-modal__panel" role="dialog" aria-modal="true" aria-label="Property details">
        <button class="mv-modal__close" data-close="1" aria-label="Done" type="button">✕</button>
        <div id="mvModalContent"></div>
    </div>
</div>

<div id="mvCalendarModal" class="mv-calendar" aria-hidden="true">
    <div class="mv-calendar__backdrop" data-cal-close="1"></div>
    <div class="mv-calendar__panel" id="mvCalendarPanel" role="dialog" aria-modal="true" aria-label="Select dates" tabindex="-1">
        <div class="mv-calendar__header">
            <div>Select dates</div>
            <button id="mvCalendarClose" class="mv-calendar__close" type="button" aria-label="Close">✕</button>
        </div>
        <div class="mv-calendar__nav">
            <button id="mvCalPrev" class="mv-calendar__navbtn" type="button" aria-label="Previous month">&#8249;</button>
            <div id="mvCalRange" class="mv-calendar__range" role="status" aria-live="polite"></div>
            <button id="mvCalNext" class="mv-calendar__navbtn" type="button" aria-label="Next month">&#8250;</button>
        </div>
        <div id="mvCalendarNotice" class="mv-calendar__notice" role="status" aria-live="polite"></div>
        <div id="mvCalendarMonths" class="mv-calendar__months"></div>
        <!-- UX6: the picker stays open after check-out; the guest confirms here (same search as the main button). -->
        <div class="mv-calendar__footer">
            <div id="mvCalSummary" class="mv-calendar__summary" aria-live="polite"></div>
            <div class="mv-calendar__actions">
                <button id="mvCalClear" class="mv-btn mv-btn--ghost" type="button">Clear dates</button>
                <button id="mvCalSearch" class="mv-btn mv-btn--primary" type="button">Check availability</button>
            </div>
        </div>
    </div>
</div>

<style>
    .mv-app{
        font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        max-width: 1120px;
        margin: 0 auto;
        padding: 10px 12px;
    }

    .mv-search{
        display: grid;
        grid-template-columns: 1fr 1fr 140px 140px;
        gap: 12px;
        align-items: end;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 18px;
        padding: 12px;
        box-shadow: 0 10px 26px rgba(0,0,0,.06);
    }

    .mv-field label{
        display:block;
        font-size: 12px;
        opacity: .75;
        margin-bottom: 6px;
    }

    .mv-field input, .mv-field select{
        width:100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 14px;
        outline: none;
        background:#fff;
    }
    .mv-field--hidden{
        display: none;
    }
    .mv-date-display{
        width:100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 14px;
        background:#fff;
        text-align: left;
        cursor: pointer;
        font-weight: 600;
    }
    .mv-date-wrapper{
        position: relative;
    }
    .mv-date-clear{
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: #888;
        font-size: 16px;
        cursor: pointer;
        padding: 2px 4px;
        display: none;
    }
    .mv-date-clear:hover{ color: #444; }
    .mv-field input:focus, .mv-field select:focus{
        border-color: #bdbdbd;
    }

    .mv-btn{
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid #e6e6e6;
        cursor: pointer;
        font-weight: 650;
        background: #fff;
    }

    .mv-btn--primary{
        border: 0;
        background: #ff385c;
        color: #fff;
        opacity: 1;
        cursor: pointer;
        box-shadow: 0 10px 26px rgba(255,56,92,.18);
        transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .mv-btn--primary:disabled{
        opacity: .55;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }
    .mv-btn--primary:hover{
        transform: translateY(-1px);
        box-shadow: 0 14px 34px rgba(255,56,92,.26);
        filter: brightness(1.02);
    }

    @media(min-width: 1024px){
        .mv-search{
            padding: 14px 12px;
            gap: 10px;
        }
        .mv-btn--primary{
            padding: 12px 16px;
        }
    }

    @media(min-width: 1024px){
        .mv-subrow{
            align-items: baseline;
            margin: 8px 4px 8px 4px;
        }
    }

    .mv-btn--ghost{
        background: #fff;
        transition: transform .12s ease;
    }
    .mv-btn--ghost:hover{ transform: translateY(-1px); }
    .mv-btn--ghost.is-active{
        border-color: #ffd6de;
        background: #fff5f7;
    }

    .mv-subrow{
        display:flex;
        justify-content: space-between;
        align-items: center;
        margin: 10px 4px 0 4px;
        gap: 10px;
    }
    .mv-msg{
        font-size: 13px;
        opacity: .8;
    }
    .mv-right{ display:flex; gap:8px; }

    .mv-grid{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 14px;
    }
    .mv-grid.mv-grouped{
        display: block;
        grid-template-columns: none;
    }
    .mv-group-header{
        font-size: 14px;
        font-weight: 700;
        margin: 16px 2px 8px 2px;
    }
    .mv-dateField{
        border: 1px solid #cfcfcf;
        border-radius: 14px;
        padding: 10px 12px;
        cursor: pointer;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        background: #fff;
    }
    .mv-dateField:hover{ background: #f7f7f7; }
    .mv-dateField > div{
        position: relative;
        padding-left: 10px;
    }
    .mv-dateField > div:first-child{
        padding-left: 0;
    }
    .mv-dateField > div:nth-child(2)::before{
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        bottom: 4px;
        width: 1px;
        background: #e4e4e4;
    }
    .mv-dateField__label{
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .04em;
        opacity: .7;
    }
    .mv-dateField__value{
        font-weight: 600;
        font-size: 14px;
        margin-top: 2px;
    }
    .mv-group-meta{
        font-size: 12px;
        opacity: .7;
        margin: 8px 2px 10px 2px;
    }
    .mv-selected{
        outline: 2px solid #ff385c;
        outline-offset: 2px;
    }
    @media(max-width: 980px){
        .mv-search{ grid-template-columns: 1fr 1fr; }
        .mv-grid{ grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 768px){
        .mv-search{
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 10px;
        }
        .mv-btn--primary{ width: 100%; }
        .mv-grid{ grid-template-columns: 1fr; gap: 20px; }
        .mv-card__body{ line-height: 1.45; }
        .mv-card__meta, .mv-card__tag{ line-height: 1.35; }
        .mv-heart{
            min-width: 44px;
            min-height: 44px;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 13px;
            line-height: 1;
            background: transparent;
            border: 0;
            box-shadow: none;
            position: relative;
            z-index: 0;
            opacity: 1;
            color: #111;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mv-heart::before{
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: rgba(255,255,255,.85);
            border: 1px solid #eee;
            transform: translate(-50%, -50%);
            z-index: -1;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
            pointer-events: none;
        }
        .mv-subrow{ margin-top: 12px; }
    }
    @media(max-width: 640px){
        .mv-grid{ grid-template-columns: 1fr; }
    }

    @media(min-width: 1024px){
        .mv-card__title{ font-size: 17px; font-weight: 780; margin: 2px 0 8px 0; }
        .mv-card__meta{ font-size: 12px; opacity: .68; gap: 8px; }
        .mv-card__tag{ margin-top: 4px; }
    }

    .mv-card{
        border: 1px solid #eee;
        border-radius: 18px;
        overflow:hidden;
        background:#fff;
        box-shadow: 0 10px 26px rgba(0,0,0,.06);
        cursor:pointer;
        position:relative;
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .mv-card.is-unavailable{
        opacity: .6;
    }
    .mv-card.is-unavailable .mv-heart{
        pointer-events: none;
    }
    .mv-card.is-unavailable .mv-card__meta span:last-child{
        display: none;
    }
    .mv-card.is-unavailable .mv-card__meta::after{
        content: "Unavailable for selected dates";
        font-size: 13px;
        opacity: .78;
    }
    .mv-card:hover{
        transform: translateY(-2px);
        box-shadow: 0 14px 34px rgba(0,0,0,.12);
    }

    .mv-card img{
        width:100%;
        height: 190px;
        object-fit: cover;
        display:block;
        background:#f3f3f3;
    }
    .mv-card .mv-card__noimg{
        width:100%;
        height: 190px;
        background:#f3f3f3;
    }

    .mv-card__media{ display:block; }
    .mv-card__link{ color: inherit; text-decoration: none; }
    .mv-card__link:focus-visible{ outline: 2px solid #111; outline-offset: 2px; border-radius: 4px; }
    .mv-card:focus-within{ box-shadow: 0 14px 34px rgba(0,0,0,.12); }
    .mv-card__body{ padding: 12px; }
    .mv-card__title{ font-weight: 750; margin: 0 0 6px 0; }
    .mv-card__meta{ font-size: 13px; opacity: .78; display:flex; justify-content:space-between; gap:10px; }
    .mv-card__tag{ font-size: 12px; opacity:.7; margin-top: 6px; }

    .mv-heart{
        position:absolute;
        top: 10px;
        right: 10px;
        background: rgba(255,255,255,.92);
        border: 1px solid #eee;
        border-radius: 999px;
        padding: 7px 10px;
        cursor:pointer;
        user-select:none;
    }
    button.mv-heart{ font: inherit; color: inherit; line-height: 1; } /* UX7b1: the heart is a real button */
    .mv-heart:focus-visible{ outline: 2px solid #111; outline-offset: 2px; }
    .mv-heart[data-on="1"]{ border-color:#ff385c; }
    .mv-heart.is-saved{ color: #ff385c; }
    .mv-heart.is-pulse{
        animation: mv-heart-pop .16s ease-out;
    }
    @keyframes mv-heart-pop{
        0%{ transform: scale(1); }
        60%{ transform: scale(1.08); }
        100%{ transform: scale(1); }
    }

    @media(max-width: 768px){
        .mv-heart{
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
    }

    .mv-modal{ position:fixed; inset:0; display:none; z-index:9999; }
    .mv-modal[aria-hidden="false"]{ display:block; }
    .mv-modal__backdrop{ position:absolute; inset:0; background: rgba(0,0,0,.55); }
    .mv-modal__panel{
        position:relative;
        max-width: 920px;
        margin: 6vh auto;
        background:#fff;
        border-radius: 18px;
        overflow:hidden;
    }
    .mv-calendar{
        position:fixed;
        inset:0;
        display:none;
        z-index:10000;
    }
    .mv-calendar[aria-hidden="false"]{ display:block; }
    .mv-calendar__backdrop{
        position:absolute;
        inset:0;
        background: rgba(0,0,0,.55);
    }
    .mv-calendar__panel{
        position:relative;
        max-width: 760px;
        margin: 10vh auto;
        background:#fff;
        border-radius: 16px;
        padding: 14px;
        max-height: 80vh; max-height: 80dvh; overflow: auto; /* UX6: footer stays reachable (sticky) on short screens */
    }
    /* UX6: footer with the selected range + Clear dates / Check availability, sticky at the panel's bottom edge. */
    .mv-calendar__footer{ position: sticky; bottom: -14px; margin: 10px -14px -14px; padding: 10px 14px 12px; background: #fff; border-top: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-radius: 0 0 16px 16px; }
    .mv-calendar__summary{ font-size: 14px; font-weight: 600; min-width: 0; }
    .mv-calendar__actions{ display: flex; gap: 8px; margin-left: auto; }
    .mv-calendar__actions .mv-btn{ padding: 9px 14px; font-size: 14px; white-space: nowrap; }
    .mv-calendar__actions .mv-btn:disabled{ opacity: .45; cursor: not-allowed; }
    .mv-calendar__actions .mv-btn:focus-visible{ outline: 2px solid #222; outline-offset: 2px; }
    .mv-calendar__header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        font-weight:700;
        margin-bottom: 8px;
    }
    .mv-calendar__close{
        border: 1px solid #eee;
        background: #fff;
        border-radius: 10px;
        padding: 6px 10px;
        cursor:pointer;
    }
    /* N1: month navigation for the main search picker */
    .mv-calendar__nav{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap: 8px;
        margin-bottom: 8px;
    }
    .mv-calendar__range{ font-weight:600; font-size: 14px; text-align:center; flex: 1; }
    .mv-calendar__navbtn{
        min-width: 44px;
        min-height: 40px;
        border: 1px solid #ddd;
        background: #fff;
        border-radius: 10px;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
    }
    .mv-calendar__navbtn:focus-visible, .mv-calendar__close:focus-visible, .mv-calendar .mv-cal__day:focus-visible{
        outline: 2px solid #222;
        outline-offset: 2px;
    }
    .mv-calendar__navbtn:disabled{ opacity: .35; cursor: not-allowed; }
    .mv-calendar__notice{ min-height: 0; font-size: 13px; color: #b91c1c; margin-bottom: 6px; }
    .mv-calendar__notice:empty{ display:none; }
    .mv-calendar__months{
        display:grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
    .mv-cal__month{
        border: 1px solid #f0f0f0;
        border-radius: 12px;
        padding: 10px;
    }
    .mv-cal__title{
        font-weight:700;
        margin-bottom: 6px;
    }
    .mv-cal__weekdays,
    .mv-cal__grid{
        display:grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        font-size: 12px;
        text-align:center;
    }
    .mv-cal__day{
        border: 1px solid transparent;
        background: #fff;
        border-radius: 8px;
        padding: 6px 0;
        cursor: pointer;
    }
    .mv-cal__day.is-disabled{
        background: #ededed;
        color: #a3a3a3;
        cursor: not-allowed;
        border: 1px solid #e0e0e0;
        opacity: 1;
    }
    .mv-cal__day.is-start,
    .mv-cal__day.is-end{
        border-color: #ff385c;
        background: #fff5f7;
        font-weight:700;
    }
    .mv-cal__day.is-inrange{
        background: #fff5f7;
    }
    /* U2: read-only Hostaway calendar inside the property modal */
    .mv-hcal{ margin-top: 12px; }
    .mv-hcal__status{ font-size: 13px; opacity: .85; margin-bottom: 6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .mv-hcal__status .mv-btn{ padding: 4px 10px; font-size: 12px; }
    .mv-hcal__legend{ display:flex; gap: 12px; flex-wrap:wrap; font-size: 12px; opacity: .8; margin-bottom: 8px; }
    .mv-hcal__legend span{ display:inline-flex; align-items:center; gap:6px; }
    .mv-hcal__swatch{ display:inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid #e0e0e0; background:#fff; }
    .mv-hcal__months{ grid-template-columns: 1fr; gap: 10px; }
    .mv-hcal__nav{ margin: 6px 0 8px; }
    .mv-hcal .mv-calendar__range{ font-size: 13px; }
    .mv-hcal .mv-cal__day:focus-visible{ outline: 2px solid #222; outline-offset: 2px; }
    .mv-hcal__selection .mv-btn[aria-pressed="true"]{ border-color:#ff385c; background:#fff5f7; }
    .mv-hcal button.mv-cal__day--hostaway{ cursor: pointer; font: inherit; }
    .mv-hcal button.mv-cal__day--hostaway.is-blocked,
    .mv-hcal button.mv-cal__day--hostaway.is-unknown{ cursor: pointer; } /* selectable as check-out; validation decides */
    .mv-hcal__selection{ margin-top: 10px; font-size: 13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .mv-hcal__selection .mv-btn{ padding: 4px 10px; font-size: 12px; }
    .mv-hcal__warn{ color: #b91c1c; }
    /* U4: quote box and unconfirmed cards */
    .mv-quote{ margin-top: 10px; font-size: 13px; display:grid; gap: 4px; }
    .mv-quote__total{ font-weight: 700; font-size: 15px; }
    .mv-quote__line{ opacity: .85; }
    .mv-quote__note{ opacity: .7; font-size: 12px; }
    .mv-quote .mv-btn{ padding: 4px 10px; font-size: 12px; margin-left: 6px; }
    .mv-card.is-unconfirmed{ opacity: .6; }
    /* D4: Book Direct savings (server-calculated estimate; display only) */
    .mv-quote__direct{ font-weight: 800; font-size: 20px; color: #111; }
    .mv-quote__directlabel{ font-weight: 600; font-size: 13px; color: #444; }
    .mv-quote__std{ opacity: .9; }
    .mv-quote__sub{ padding-left: 12px; font-size: 12px; opacity: .75; }
    .mv-quote__save{ color: #0f7a3d; font-weight: 700; opacity: 1; }
    .mv-quote__esttotal{ font-weight: 700; opacity: 1; }

        font-size: 12px;
        opacity: .7;
    }
    .mv-link{
        display:inline-block;
        font-size: 13px;
        opacity:.85;
        margin-top: 8px;
    }
</style>

<script>
(() => {
    const CONFIG = {
        defaultGuests: 2,
        sameDayCheckin: false,
        favoritesKey: "mv_saved"
    };
    // ---- Environment-specific API configuration (Stage F4 / U1) ----
    // Explicit map of recognised deployment hosts -> backend. Unknown hosts get
    // NO backend (API_BASE = null) and the page shows an informational state
    // instead of silently talking to the wrong environment. The production UI
    // keeps the production proxy exactly as before. No credentials live here:
    // the /api/booking/* routes are public and read-only by design.
    const PRODUCTION_API = "https://maravilla-smoobu-proxy.vercel.app";
    // Development/preview backend = the proxy's DEV branch alias (Hostaway Stages
    // A–F3 merged to proxy DEV on 2026-10-18). Step B1 replaced the former
    // proxy feature-branch alias here; production hosts are untouched.
    const DEV_API = "https://maravilla-smoobu-proxy-git-dev-joel-goralskis-projects.vercel.app";
    const API_ENVIRONMENTS = Object.freeze({
        "maravilla-booking-ui.vercel.app": PRODUCTION_API,
        "www.maravillanayarit.com": PRODUCTION_API,
        "maravillanayarit.com": PRODUCTION_API,
        "maravilla-booking-ui-git-dev-joel-goralskis-projects.vercel.app": DEV_API,
        "localhost": DEV_API,
        "127.0.0.1": DEV_API
    });
    // Git-branch preview aliases of THIS Vercel project (e.g. feature/hostaway-ui)
    // are a recognised class: they always target the proxy DEV backend.
    const PROJECT_PREVIEW_HOST = /^maravilla-booking-ui-git-[a-z0-9-]+-joel-goralskis-projects\.vercel\.app$/;
    function resolveApiBase(hostname) {
        if (Object.prototype.hasOwnProperty.call(API_ENVIRONMENTS, hostname)) return API_ENVIRONMENTS[hostname];
        if (PROJECT_PREVIEW_HOST.test(hostname)) return DEV_API;
        return null; // unknown host: fail safe
    }
    const API_BASE = resolveApiBase(window.location.hostname);

    // Inventory comes from the sanitized public listings endpoint (Hostaway is
    // the authoritative source; the former hard-coded Smoobu list is gone).
    let PROPERTIES = [];
    const UI_TEXT = {
        noBackend: "This deployment is not configured for live property data.",
        loadFailed: "Properties could not be loaded right now.",
        loading: "Loading properties…"
    };
    UI_TEXT.calLoading = "Loading live calendar…";
    UI_TEXT.calOk = "Live calendar";
    UI_TEXT.calIncomplete = "Some dates could not be confirmed";
    UI_TEXT.calError = "Availability could not be confirmed";
    UI_TEXT.calBeyond = "Dates outside the shown months are not confirmed";
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const httpsUrl = (v) => (typeof v === "string" && /^https:\/\/[^\s"'<>]+$/i.test(v) ? v : null);
    const posInt = (v) => (Number.isInteger(v) && v > 0 ? v : null);
    const MAX_GALLERY_IMAGES = 12; // the public feed sends at most 12 (lib/listing-public.js MAX_PUBLIC_IMAGES)
    /** UX2b: ordered, de-duplicated https photo URLs. The card image (`img`) leads so the gallery opens on the photo
     *  the guest clicked; then `images[].url` in feed order. Malformed entries are dropped, never repaired. Captions
     *  are not used (none are published today and none have been reviewed for public display). */
    function galleryUrls(l) {
        const out = [];
        const add = (u) => { const ok = httpsUrl(u); if (ok && !out.includes(ok) && out.length < MAX_GALLERY_IMAGES) out.push(ok); };
        add(l.img);
        if (Array.isArray(l.images)) for (const i of l.images) add(i && typeof i === "object" ? i.url : null);
        return out;
    }
    /** UX2c: "HH:MM" (24 h) exactly as the feed sends it, else null — never a default time. */
    const hhmm = (v) => (typeof v === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : null);
    const MAX_AMENITIES = 60;
    // Labels held back from display until the owner confirms what they mean for maraVilla guests. Hostaway's "Beach"
    // flag does not say whether there is beach access, a beach nearby or a beachfront location, and the brief forbids
    // implying beach access unless verified. Held labels are dropped here, before any rendering.
    const AMENITY_HOLD = new Set(["beach"]);
    /** UX2c: sanitized amenity labels in feed order — strings only, trimmed, 2–80 chars, printable, de-duplicated
     *  (case-insensitive), capped; held labels removed. Nothing is renamed, merged or inferred. */
    function cleanAmenities(list) {
        if (!Array.isArray(list)) return [];
        const out = [], seen = new Set();
        for (const raw of list) {
            if (typeof raw !== "string") continue;
            const label = raw.replace(/\s+/g, " ").trim();
            if (label.length < 2 || label.length > 80 || /[\u0000-\u001f\u007f<>]/.test(label)) continue;
            const key = label.toLowerCase();
            if (seen.has(key) || AMENITY_HOLD.has(key)) continue;
            seen.add(key); out.push(label);
            if (out.length >= MAX_AMENITIES) break;
        }
        return out;
    }
    // Validate one listing from the API. Anything unusable is skipped, never invented.
    function toProperty(l) {
        if (!l || typeof l !== "object") return null;
        const id = posInt(l.id);
        const name = typeof l.name === "string" ? l.name.trim() : "";
        const sleeps = posInt(l.sleeps);
        if (!id || !name || !sleeps) return null;
        return {
            id,
            slug: typeof l.slug === "string" && l.slug ? l.slug : `hostaway-${id}`,
            source: "hostaway",
            name,
            sleeps,
            tagline: typeof l.tagline === "string" ? l.tagline : "",
            summary: typeof l.summary === "string" ? l.summary : "",
            img: httpsUrl(l.img),
            images: galleryUrls(l), // UX2b: property-page gallery only (cards and the modal keep using `img`)
            currency: typeof l.currency === "string" ? l.currency : null,
            url: httpsUrl(l.url),
            // UX1: facts the public feed already sends (F1 whitelist); null when absent, never guessed
            bedrooms: Number.isInteger(l.bedrooms) && l.bedrooms >= 0 ? l.bedrooms : null,
            bathrooms: typeof l.bathrooms === "number" && Number.isFinite(l.bathrooms) && l.bathrooms >= 0 ? l.bathrooms : null,
            city: typeof l.city === "string" && l.city.trim() ? l.city.trim() : null,
            // UX2c: property-information fields the feed already sends (UX2a whitelist); null / [] when absent or malformed
            beds: Number.isInteger(l.beds) && l.beds > 0 && l.beds <= 50 ? l.beds : null,
            amenities: cleanAmenities(l.amenities),
            checkInFrom: hhmm(l.checkInFrom),
            checkOutBy: hhmm(l.checkOutBy)
        };
    }

    // ---- Hostaway calendar (Stage F4 / U2): per-listing, display-only ----
    // Source: GET /api/booking/calendar?id=<listing> (default window today..+90).
    // `unavailable[]` ranges are arrival-inclusive / departure-exclusive: the
    // night of `arrival` up to but NOT including `departure` is blocked.
    // State is kept per listing id and replaced on every modal open; a late
    // response for a previously opened listing is discarded.
    // Fail closed: any malformed response, HTTP failure or incomplete coverage
    // renders nights as "not confirmed" (never as available).
    // Night selection / arrival-departure validation is deliberately NOT part
    // of U2 (scheduled for U3): the calendar is read-only here.
    // N2: per-listing modal calendar state (keys normalised: ids arrive as numbers from listings and strings from the DOM):
    //   { viewMonth: Date (left visible month), view: {key, loading, parsed}|null, viewToken,
    //     stay: {key, loading, parsed}|null, stayToken }
    // `view` = fresh availability for the VISIBLE months only (replaced on every navigation, shown as
    // "not confirmed" while loading/failed). `stay` = a fresh window covering exactly the selected
    // check-in..check-out; a stay is only ever judged against it. Tokens discard late responses.
    const calendarByListing = new Map();

    const isoDateRe = /^\d{4}-\d{2}-\d{2}$/;
    const isIsoDate = (v) => typeof v === "string" && isoDateRe.test(v) && !Number.isNaN(Date.parse(`${v}T00:00:00Z`));
    const addDaysISO = (iso, n) => {
        const [y, m, d] = iso.split("-").map(Number);
        return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
    };

    /** Strictly parse the public calendar payload for one listing. Never throws. */
    function parseCalendarResponse(json, expectedId) {
        const fail = (reason) => ({ status: "error", reason, nights: new Set(), ranges: [], from: null, to: null, checkedAt: null });
        if (!json || typeof json !== "object") return fail("NOT_AN_OBJECT");
        if (json.ok !== true) return fail("NOT_OK");
        if (Number(json.listingId) !== Number(expectedId)) return fail("LISTING_MISMATCH");
        if (!isIsoDate(json.from) || !isIsoDate(json.to) || json.to < json.from) return fail("BAD_WINDOW");
        if (!Array.isArray(json.unavailable)) return fail("BAD_UNAVAILABLE");
        if (!json.coverage || typeof json.coverage !== "object" || typeof json.coverage.complete !== "boolean") return fail("BAD_COVERAGE");
        const nights = new Set();
        const ranges = [];
        for (const r of json.unavailable) {
            if (!r || typeof r !== "object" || !isIsoDate(r.arrival) || !isIsoDate(r.departure) || !(r.arrival < r.departure)) return fail("BAD_RANGE");
            if (nightsSpan(r.arrival, r.departure) > 400) return fail("BAD_RANGE");
            for (let d = r.arrival; d < r.departure; d = addDaysISO(d, 1)) nights.add(d); // departure-exclusive
            ranges.push({ arrival: r.arrival, departure: r.departure });
        }
        return {
            status: json.coverage.complete ? "ok" : "incomplete",
            reason: null,
            nights,
            ranges,
            from: json.from,
            to: json.to,
            checkedAt: typeof json.checkedAt === "string" ? json.checkedAt : null
        };
    }
    function nightsSpan(a, b) {
        return Math.round((Date.parse(`${b}T00:00:00Z`) - Date.parse(`${a}T00:00:00Z`)) / 86400000);
    }

    /** Classification of one calendar day for display: past | unavailable | available | unknown. */
    function nightState(iso, state, todayIso) {
        if (iso < todayIso) return "past";
        if (!state || state.status === "error") return "unknown";
        if (iso < state.from || iso > state.to) return "unknown"; // outside the fetched window
        if (state.nights.has(iso)) return "unavailable";
        if (state.status === "incomplete") return "unknown";     // coverage gaps: never assume available
        return "available";
    }

    // ---- Night-based stay selection (Stage F4 / U3) ----
    // A stay from `start` to `end` occupies the nights start .. end-1 (departure
    // exclusive). Every occupied night must be an "available" night; the
    // departure day itself is not occupied, so checking out on the first night
    // of a block is fine from an occupancy standpoint. Anything else about the
    // stay (min/max stay, closed-on-arrival/departure, capacity, lead time,
    // price) is decided by the backend's validated quote (U4) — this check never
    // declares a stay bookable, only "occupied nights clear" or a rejection.
    const selectionByListing = new Map(); // String(id) -> { start, end }

    // ---- UX4a: calendar host ----
    // The calendar rules below (window fetch, night states, selection editing, fresh stay verification, highlighting,
    // navigation bounds, fail-closed status) exist ONCE and are parameterised by a presentation host. A host owns:
    //   el(name)           its DOM elements: box, status, prev, next, range, legend, months, selection
    //   isActive(id)       whether `id` is the listing this host currently shows; false once the host is closed /
    //                      destroyed, so a late answer for an inactive host is dropped (even for the same listing)
    //   activeId()         the listing the host is showing (used by the months click handler)
    //   selection          its OWN Map  String(id) -> { start, end, edit?, message? }
    //   calendars          its OWN Map  String(id) -> { viewMonth, view, viewToken, stay, stayToken }
    //   onDatesChanged(id) called whenever the selection / verification changes so a dependent price must be dropped
    //   renderActions(id, ctx) host-specific buttons after the selection text (modal: Retry / Change / Clear / Check price)
    //   afterSelection(id, sel) host-specific mirrors (modal: dates pill + quote box re-render)
    // Two hosts may show the same listing (e.g. the modal and a property-page editor): their Maps, request tokens and
    // DOM are separate, so neither can update the other. The modal host below reproduces the pre-UX4a modal exactly.
    const MODAL_CAL_IDS = { box: "mvHostawayCalendar", status: "mvHostawayCalendarStatus", prev: "mvHcalPrev", next: "mvHcalNext", range: "mvHcalRange", legend: "mvHostawayCalendarLegend", months: "mvHostawayCalendarMonths", selection: "mvHostawaySelection" };
    const modalCalendarHost = {
        name: "modal",
        el: (name) => $(MODAL_CAL_IDS[name]),
        isActive: (id) => String(window.mvSelectedApartmentId) === String(id),
        activeId: () => String(window.mvSelectedApartmentId),
        selection: selectionByListing,
        calendars: calendarByListing,
        onDatesChanged: (id) => { quoteByListing.delete(String(id)); modalQuoteSeq += 1; }, // U4: no price survives a date change
        renderActions(id, { sel, verified, checkFailed, addBtn, actions }) {
            if (checkFailed) addBtn("Retry", actions.retry);
            if (sel.start && sel.end) {
                addBtn("Change check-in", actions.editStart, "mv-btn mv-btn--ghost", { "aria-pressed": String(sel.edit === "start") });
                addBtn("Change check-out", actions.editEnd, "mv-btn mv-btn--ghost", { "aria-pressed": String(sel.edit === "end") });
            }
            if (sel.start || sel.end) addBtn("Clear dates", actions.clear, "mv-btn mv-btn--ghost", { "aria-label": "Clear dates" });
            // U4: price check, offered only once the fresh stay check has cleared the occupied nights.
            if (verified) {
                const btn = addBtn("Check price", () => requestModalQuote(id), "mv-btn mv-btn--primary");
                btn.id = "mvHostawayQuoteBtn";
            }
        },
        afterSelection(id, sel) {
            const pill = $("mvModalDatesPill");
            if (pill) pill.textContent = sel.start && sel.end ? `${fmtShort(sel.start)} → ${fmtShort(sel.end)}` : sel.start ? `Check-in ${fmtShort(sel.start)}` : "Dates not selected";
            renderModalQuote(id);
        }
    };
    function evaluateStaySelection(start, end, state, todayIso) {
        if (!isIsoDate(start)) return { ok: false, reason: "NO_START" };
        if (start < todayIso) return { ok: false, reason: "PAST_START", night: start };
        if (!isIsoDate(end)) return { ok: false, reason: "NO_END" };
        if (!(end > start)) return { ok: false, reason: "END_NOT_AFTER_START" };
        const nights = [];
        for (let d = start; d < end; d = addDaysISO(d, 1)) {
            const s = nightState(d, state, todayIso);
            if (s === "unavailable") return { ok: false, reason: "NIGHT_UNAVAILABLE", night: d, nights };
            if (s !== "available") return { ok: false, reason: "NIGHT_UNCONFIRMED", night: d, nights };
            nights.push(d);
            if (nights.length > 90) return { ok: false, reason: "TOO_LONG", nights };
        }
        return { ok: true, nights, count: nights.length };
    }
    const SELECTION_TEXT = {
        PAST_START: "Check-in must be a future date.",
        NIGHT_UNAVAILABLE: "That stay includes an unavailable night",
        NIGHT_UNCONFIRMED: "That stay includes a night that could not be confirmed",
        TOO_LONG: "Stays longer than 90 nights cannot be requested online.",
        END_NOT_AFTER_START: "Check-out must be after check-in."
    };
    function fmtShort(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(new Date(y, m - 1, d));
    }

    const errState = (reason) => ({ status: "error", reason, nights: new Set(), ranges: [], from: null, to: null, checkedAt: null });
    const calFor = (host, id) => {
        const k = String(id);
        let c = host.calendars.get(k);
        if (!c) { c = { viewMonth: null, view: null, viewToken: 0, stay: null, stayToken: 0 }; host.calendars.set(k, c); }
        return c;
    };
    // A response may only land if this host still holds the same calendar object AND still shows this listing.
    const isCurrentCal = (host, id, cal) => host.calendars.get(String(id)) === cal && host.isActive(id);

    /** One fresh, no-store calendar window for a listing. Never throws; any problem is an "error" state (fail closed). */
    async function fetchCalendarWindow(id, from, to) {
        if (!API_BASE) return errState("NO_BACKEND");
        try {
            const qs = new URLSearchParams({ id: String(id), from, to });
            const response = await fetch(`${API_BASE}/api/booking/calendar?${qs}`, { method: "GET", cache: "no-store" });
            if (!response.ok) return errState(`HTTP_${response.status}`);
            const parsed = parseCalendarResponse(await response.json(), id);
            if (parsed.status !== "error" && (parsed.from !== from || parsed.to !== to)) return errState("WINDOW_MISMATCH"); // must answer the window we asked for
            return parsed;
        } catch (err) {
            console.error("Failed to load calendar:", err);
            return errState("FETCH_FAILED");
        }
    }

    /** Window to fetch for the two visible months: clipped to today (past) and to the booking horizon. */
    function viewWindowFor(viewMonth) {
        const today = startOfToday();
        const last = lastSelectableDate(today);
        const monthStart = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
        const monthsEnd = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + CALENDAR_POLICY.visibleMonths, 0);
        return { from: toISODate(monthStart < today ? today : monthStart), to: toISODate(monthsEnd > last ? last : monthsEnd) };
    }

    /** Fetch fresh availability for the visible months. While loading (and on failure) every date is "not confirmed". */
    async function loadViewWindow(host, id) {
        const cal = calFor(host, id);
        const token = ++cal.viewToken;
        const win = viewWindowFor(cal.viewMonth);
        const key = `${win.from}|${win.to}`;
        cal.view = { key, loading: true, parsed: null };
        renderHostawayCalendar(host, id);
        const parsed = win.from <= win.to ? await fetchCalendarWindow(id, win.from, win.to) : errState("EMPTY_WINDOW");
        if (token !== cal.viewToken || !isCurrentCal(host, id, cal)) return; // superseded by navigation / another property / host closed
        cal.view = { key, loading: false, parsed };
        renderHostawayCalendar(host, id);
    }

    /** Fresh window for exactly the selected stay. A complete selection is only "clear" once this answers. */
    async function refreshStayCheck(host, id) {
        const key = String(id);
        const cal = calFor(host, id);
        const sel = host.selection.get(key);
        const token = ++cal.stayToken;
        if (!sel || !sel.start || !sel.end) { cal.stay = null; return; }
        const k = `${sel.start}|${sel.end}`;
        cal.stay = { key: k, loading: true, parsed: null };
        applyHostawaySelection(host, id);
        const parsed = nightsSpan(sel.start, sel.end) > CALENDAR_POLICY.maxStayNights ? errState("TOO_LONG") : await fetchCalendarWindow(id, sel.start, sel.end);
        const cur = host.selection.get(key);
        if (token !== cal.stayToken || !isCurrentCal(host, id, cal) || !cur || `${cur.start}|${cur.end}` !== k) return;
        cal.stay = { key: k, loading: false, parsed };
        applyHostawaySelection(host, id);
    }

    /** Modal open / Retry: fresh visible window, plus a fresh stay check when a stay is selected. */
    function loadHostawayCalendar(host, id) {
        const sel = host.selection.get(String(id));
        loadViewWindow(host, id);
        if (sel && sel.start && sel.end) refreshStayCheck(host, id);
    }

    function renderHostawayCalendar(host, id) {
        const status = host.el("status");
        const months = host.el("months");
        const legend = host.el("legend");
        if (!status || !months) return;
        if (!host.isActive(id)) return;
        const cal = host.calendars.get(String(id));
        if (!cal || !cal.viewMonth) return;
        const loading = !cal.view || cal.view.loading;
        const state = loading ? null : cal.view.parsed;
        const todayIso = toISODate(new Date());
        const lastIso = toISODate(lastSelectableDate(startOfToday()));

        status.innerHTML = "";
        if (loading) {
            status.textContent = UI_TEXT.calLoading;
        } else if (!state || state.status === "error") {
            status.textContent = `${UI_TEXT.calError}. `;
            const retry = document.createElement("button");
            retry.type = "button";
            retry.className = "mv-btn mv-btn--ghost";
            retry.textContent = "Retry";
            retry.addEventListener("click", () => loadHostawayCalendar(host, id));
            status.appendChild(retry);
        } else if (state.status === "incomplete") {
            status.textContent = `${UI_TEXT.calIncomplete} · ${UI_TEXT.calBeyond}.`;
        } else {
            status.textContent = `${UI_TEXT.calOk} · checked ${state.checkedAt ? new Date(state.checkedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "just now"} · ${UI_TEXT.calBeyond}.`;
        }
        if (legend) legend.style.display = "";

        // Navigation state
        const bounds = viewBounds();
        const prevBtn = host.el("prev"), nextBtn = host.el("next"), rangeEl = host.el("range");
        if (prevBtn) prevBtn.disabled = cal.viewMonth <= bounds.min;
        if (nextBtn) nextBtn.disabled = cal.viewMonth >= bounds.max;

        months.innerHTML = "";
        const base = cal.viewMonth;
        const titles = [];
        for (let offset = 0; offset < CALENDAR_POLICY.visibleMonths; offset += 1) {
            const monthDate = new Date(base.getFullYear(), base.getMonth() + offset, 1);
            const monthTitle = monthDate.toLocaleString("en-US", { month: "long", year: "numeric" });
            titles.push(monthTitle);
            const firstDay = monthDate.getDay();
            const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
            const monthEl = document.createElement("div");
            monthEl.className = "mv-cal__month";
            monthEl.innerHTML = `
                <div class="mv-cal__title">${esc(monthTitle)}</div>
                <div class="mv-cal__weekdays">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>
                <div class="mv-cal__grid"></div>
            `;
            const grid = monthEl.querySelector(".mv-cal__grid");
            for (let i = 0; i < firstDay; i += 1) grid.appendChild(document.createElement("div"));
            for (let day = 1; day <= daysInMonth; day += 1) {
                const iso = toISODate(new Date(monthDate.getFullYear(), monthDate.getMonth(), day));
                // past | far (beyond the booking horizon) | unavailable | available | unknown (loading, failed, outside the fetched window)
                const s = iso < todayIso ? "past" : iso > lastIso ? "far" : nightState(iso, state, todayIso);
                const inert = s === "past" || s === "far";
                const cell = document.createElement(inert ? "div" : "button");
                if (!inert) cell.type = "button";
                cell.className = "mv-cal__day mv-cal__day--hostaway";
                cell.textContent = String(day);
                cell.dataset.date = iso;
                cell.dataset.state = s;
                if (inert) cell.classList.add("is-disabled");
                if (s === "unavailable") cell.classList.add("is-blocked");
                if (s === "unknown") { cell.classList.add("is-unknown"); cell.setAttribute("aria-disabled", "true"); } // unconfirmed dates cannot be chosen
                cell.setAttribute("aria-label", `${iso}: ${s === "unavailable" ? "unavailable" : s === "available" ? "available" : s === "past" ? "past" : s === "far" ? "too far ahead" : "not confirmed"}`);
                grid.appendChild(cell);
            }
            months.appendChild(monthEl);
        }
        if (rangeEl) rangeEl.textContent = titles.length > 1 ? `${titles[0]} – ${titles[titles.length - 1]}` : titles[0];
        if (!months.dataset.bound) {
            months.dataset.bound = "1";
            months.addEventListener("click", (event) => {
                const cell = event.target.closest(".mv-cal__day--hostaway");
                if (!cell || cell.dataset.state === "past" || cell.dataset.state === "far") return;
                handleHostawayDayClick(host, host.activeId(), cell.dataset.date, cell.dataset.state);
            });
        }
        applyHostawaySelection(host, id);
    }

    /** Month navigation: fresh visible window; any shown price is dropped; a selected stay is re-checked; no quote is requested. */
    function navigateHostawayCalendar(host, id, delta) {
        const key = String(id);
        const cal = host.calendars.get(key);
        if (!cal || !cal.viewMonth || !host.isActive(id)) return;
        const target = clampViewMonth(addMonths(cal.viewMonth, delta));
        if (target.getTime() === cal.viewMonth.getTime()) return;
        const prevBtn = host.el("prev"), nextBtn = host.el("next");
        const hadFocus = document.activeElement; // captured first: the browser drops focus as soon as a focused button is disabled
        cal.viewMonth = target;
        host.onDatesChanged(id);
        const sel = host.selection.get(key);
        if (sel && sel.message) host.selection.set(key, { start: sel.start || null, end: sel.end || null, edit: sel.edit });
        loadViewWindow(host, id); // renders immediately (everything "not confirmed"), then the fresh window
        if (sel && sel.start && sel.end) refreshStayCheck(host, id);
        const panel = host.el("box");
        if (prevBtn && nextBtn) {
            if (hadFocus === prevBtn && prevBtn.disabled) { if (!nextBtn.disabled) nextBtn.focus(); else if (panel) panel.focus(); }
            else if (hadFocus === nextBtn && nextBtn.disabled) { if (!prevBtn.disabled) prevBtn.focus(); else if (panel) panel.focus(); }
        }
    }
    function bindCalendarControls(host, id) {
        const prevBtn = host.el("prev"), nextBtn = host.el("next"), box = host.el("box");
        if (!prevBtn || !nextBtn || !box) return;
        prevBtn.addEventListener("click", () => navigateHostawayCalendar(host, id, -1));
        nextBtn.addEventListener("click", () => navigateHostawayCalendar(host, id, 1));
        box.addEventListener("keydown", (event) => {
            if (event.key === "PageUp") { event.preventDefault(); navigateHostawayCalendar(host, id, -1); }
            else if (event.key === "PageDown") { event.preventDefault(); navigateHostawayCalendar(host, id, 1); }
        });
    }

    /** Search-bar dates as REQUESTED dates for the modal: only if they could be a bookable stay shape; the property's own calendar and the server decide the rest. */
    function seedSelectionFromSearch() {
        const a = $("mvCheckin").value, b = $("mvCheckout").value;
        if (!a || !b) return { ok: false, invalid: false };
        const todayIso = toISODate(new Date());
        const lastIso = toISODate(lastSelectableDate(startOfToday()));
        let reason = null;
        if (!isIsoDate(a) || !isIsoDate(b)) reason = "they are not valid dates.";
        else if (a < todayIso) reason = SELECTION_TEXT.PAST_START;
        else if (!(b > a)) reason = SELECTION_TEXT.END_NOT_AFTER_START;
        else if (nightsSpan(a, b) > CALENDAR_POLICY.maxStayNights) reason = SELECTION_TEXT.TOO_LONG;
        else if (b > lastIso) reason = "those dates are further ahead than online booking allows.";
        if (reason) return { ok: false, invalid: true, message: `Your search dates could not be used: ${reason}` };
        return { ok: true, start: a, end: b };
    }

    /** Selection editing: check-in then check-out; "Change check-in/check-out" edits one end; every change drops the price and re-checks the stay. */
    function handleHostawayDayClick(host, id, iso, dayState) {
        const key = String(id);
        const sel = host.selection.get(key) || { start: null, end: null };
        const keep = (message) => { host.selection.set(key, { start: sel.start || null, end: sel.end || null, edit: sel.edit, message }); applyHostawaySelection(host, id); };
        if (dayState === "unknown") { keep(`${fmtShort(iso)} is not confirmed yet — wait for the calendar to load, or retry.`); return; }
        let next;
        if (sel.edit === "end" && sel.start) {
            if (iso <= sel.start) { keep(SELECTION_TEXT.END_NOT_AFTER_START); return; }
            next = { start: sel.start, end: iso };
        } else if (sel.edit === "start") {
            if (dayState !== "available") { keep(dayState === "unavailable" ? `${fmtShort(iso)} is not available for check-in.` : `${fmtShort(iso)} could not be confirmed — choose another check-in date.`); return; }
            next = { start: iso, end: sel.end && sel.end > iso ? sel.end : null };
        } else if (!sel.start || (sel.start && sel.end) || iso <= sel.start) {
            // (re)start a selection: the check-in night itself must be available
            if (dayState !== "available") {
                host.selection.set(key, { start: null, end: null, message: dayState === "unavailable" ? `${fmtShort(iso)} is not available for check-in.` : `${fmtShort(iso)} could not be confirmed — choose another check-in date.` });
                applyHostawaySelection(host, id);
                return;
            }
            next = { start: iso, end: null };
        } else {
            next = { start: sel.start, end: iso };
        }
        if (next.start && next.end && nightsSpan(next.start, next.end) > CALENDAR_POLICY.maxStayNights) next = { start: null, end: null, message: SELECTION_TEXT.TOO_LONG };
        host.selection.set(key, next);
        host.onDatesChanged(id); // any change of dates invalidates the previous quote (U4)
        const cal = calFor(host, id);
        cal.stay = null; cal.stayToken += 1; // the previous availability decision does not survive a date edit
        applyHostawaySelection(host, id);
        if (next.start && next.end) refreshStayCheck(host, id);
    }

    /** Paint the current selection for `id` and refresh the summary line. A complete stay is judged only against its own fresh window. */
    function applyHostawaySelection(host, id) {
        const months = host.el("months");
        const summary = host.el("selection");
        if (!months || !summary) return;
        if (!host.isActive(id)) return;
        const key = String(id);
        const cal = calFor(host, id);
        const todayIso = toISODate(new Date());
        let sel = host.selection.get(key) || { start: null, end: null };
        let verified = false, pending = false, checkFailed = false;
        if (sel.start && sel.end) {
            const stay = cal.stay;
            if (!stay || stay.key !== `${sel.start}|${sel.end}` || stay.loading) pending = true;
            else if (!stay.parsed || stay.parsed.status === "error") checkFailed = true;
            else {
                const v = evaluateStaySelection(sel.start, sel.end, stay.parsed, todayIso);
                if (!v.ok) {
                    sel = { start: null, end: null, message: `${fmtShort(sel.start)} → ${fmtShort(sel.end)}: ${SELECTION_TEXT[v.reason] || "Selected dates are no longer valid"}${v.night ? ` (${fmtShort(v.night)})` : ""}. Please choose again.` };
                    host.selection.set(key, sel);
                    cal.stay = null; cal.stayToken += 1;
                    host.onDatesChanged(id);
                } else verified = true;
            }
        }
        months.querySelectorAll(".mv-cal__day--hostaway").forEach((cell) => {
            const d = cell.dataset.date;
            const isStart = !!sel.start && d === sel.start, isEnd = !!sel.end && d === sel.end, inRange = !!(sel.start && sel.end) && d > sel.start && d < sel.end;
            cell.classList.toggle("is-start", isStart);
            cell.classList.toggle("is-end", isEnd);
            cell.classList.toggle("is-inrange", inRange);
            const base = cell.getAttribute("aria-label").replace(/, (check-in|check-out|in selected stay)$/, "");
            cell.setAttribute("aria-label", base + (isStart ? ", check-in" : isEnd ? ", check-out" : inRange ? ", in selected stay" : ""));
            if (cell.tagName === "BUTTON") { if (isStart || isEnd) cell.setAttribute("aria-pressed", "true"); else cell.removeAttribute("aria-pressed"); }
        });
        summary.innerHTML = "";
        const text = document.createElement("span");
        const addBtn = (label, handler, cls = "mv-btn mv-btn--ghost", extra) => {
            const b = document.createElement("button");
            b.type = "button"; b.className = cls; b.textContent = label;
            if (extra) Object.entries(extra).forEach(([k, v]) => b.setAttribute(k, v));
            b.addEventListener("click", handler);
            summary.appendChild(b);
            return b;
        };
        if (sel.start && sel.end) {
            const n = nightsSpan(sel.start, sel.end);
            const range = `${fmtShort(sel.start)} → ${fmtShort(sel.end)} · ${n} night${n === 1 ? "" : "s"}`;
            if (pending) text.textContent = `${range} · checking availability…`;
            else if (checkFailed) { text.textContent = `${range} · availability for these dates could not be confirmed.`; text.className = "mv-hcal__warn"; }
            else text.textContent = `${range} · occupied nights clear. Final eligibility (stay rules, capacity) and price are confirmed in the next step.`;
        } else if (sel.start) {
            text.textContent = `Check-in ${fmtShort(sel.start)} — now choose a check-out date.`;
        } else if (sel.message) {
            text.textContent = sel.message;
            text.className = "mv-hcal__warn";
        } else {
            text.textContent = "Select a check-in night, then a check-out day.";
        }
        summary.appendChild(text);
        if (sel.message && (sel.start || sel.end)) {
            const warn = document.createElement("span"); warn.className = "mv-hcal__warn"; warn.textContent = sel.message; summary.appendChild(warn);
        }
        if (sel.edit === "start" || sel.edit === "end") {
            const hint = document.createElement("span");
            hint.textContent = sel.edit === "start" ? "Choose a new check-in date." : "Choose a new check-out date.";
            summary.appendChild(hint);
        }
        // Generic selection actions; the host decides which buttons to show and adds its own (e.g. the modal's price check).
        const actions = {
            retry: () => refreshStayCheck(host, id),
            editStart: () => { host.selection.set(key, { start: sel.start, end: sel.end, edit: sel.edit === "start" ? undefined : "start" }); applyHostawaySelection(host, id); },
            editEnd: () => { host.selection.set(key, { start: sel.start, end: sel.end, edit: sel.edit === "end" ? undefined : "end" }); applyHostawaySelection(host, id); },
            clear: () => {
                host.selection.set(key, { start: null, end: null });
                host.onDatesChanged(id); // no price survives clearing
                const c = calFor(host, id); c.stay = null; c.stayToken += 1;
                applyHostawaySelection(host, id);
            }
        };
        host.renderActions(id, { sel, verified, pending, checkFailed, addBtn, actions });
        host.afterSelection(id, sel);
    }

    // ---- Server-validated quote (Stage F4 / U4) ----
    // GET /api/booking/quote?id&from&to&guests. The backend decides eligibility
    // (every night open, min/max stay, closures, capacity, lead time) and only
    // then prices the stay with Hostaway. The UI shows exactly three states:
    //   quoted      -> amounts in the response currency (never converted)
    //   unavailable -> the backend's reasons, no price
    //   unconfirmed -> "could not be confirmed", no price, never "available"
    // Malformed payloads, HTTP errors and timeouts are "unconfirmed". A quote is
    // a price, not a reservation: nothing here holds inventory or checks out.
    const QUOTE_DECISIONS = new Set(["quoted", "unavailable", "unconfirmed"]);
    const quoteByListing = new Map();   // String(id) -> { key, result }
    let modalQuoteSeq = 0;
    let searchSeq = 0;
    let resultsKey = null; // UX7b1: ci|co|guests the currently shown search prices were validated for (null = none shown)
    const UNCONFIRMED = (reason) => ({ state: "unconfirmed", reason });
    const isMoney = (v) => typeof v === "number" && Number.isFinite(v) && v >= 0;

    // Whole amounts keep no decimals ("6,600 MXN"); any fractional amount shows both cents ("1,439.50 MXN", not "1,439.5").
    function fmtMoney(amount, currency) {
        const cents = Number.isInteger(Math.round(amount * 100) / 100) ? 0 : 2;
        return `${new Intl.NumberFormat("en-US", { minimumFractionDigits: cents, maximumFractionDigits: 2 }).format(amount)} ${currency}`;
    }
    // Currency wording for notes. Display only: amounts are always shown in the backend's currency and never converted.
    const CURRENCY_NAMES = Object.freeze({ MXN: "Mexican pesos (MXN)", USD: "US dollars (USD)" });
    function currencyLabel(code) {
        if (typeof code !== "string" || !/^[A-Z]{3}$/.test(code)) return null;
        return CURRENCY_NAMES[code] || code;
    }
    /** Footer note under the search bar, from the currencies of the loaded listings (never assumed). */
    function currencyNoteText(list) {
        const codes = [...new Set((Array.isArray(list) ? list : []).map((p) => p && currencyLabel(p.currency) ? p.currency : null).filter(Boolean))].sort();
        if (codes.length === 1) return `Prices are shown in ${currencyLabel(codes[0])}.`;
        if (codes.length > 1) return `Prices are shown in each property's own currency (${codes.join(", ")}); amounts are not converted.`;
        return "Prices are shown in each property's listed currency.";
    }

    /** Strictly validate a quote payload against the request it answers. Never throws. */
    function parseQuoteResponse(json, req) {
        if (!json || typeof json !== "object") return UNCONFIRMED("NOT_AN_OBJECT");
        if (json.ok !== true) return UNCONFIRMED("NOT_OK");
        if (!QUOTE_DECISIONS.has(json.decision)) return UNCONFIRMED("BAD_DECISION");
        if (Number(json.listingId) !== Number(req.id) || json.from !== req.from || json.to !== req.to || Number(json.guests) !== Number(req.guests)) return UNCONFIRMED("ECHO_MISMATCH");
        const expectedNights = nightsSpan(req.from, req.to);
        if (!Number.isInteger(json.nights) || json.nights !== expectedNights) return UNCONFIRMED("BAD_NIGHTS");
        const currency = typeof json.currency === "string" && /^[A-Z]{3}$/.test(json.currency) ? json.currency : null;
        const checkedAt = typeof json.checkedAt === "string" ? json.checkedAt : null;
        if (json.decision === "unconfirmed") return { state: "unconfirmed", reason: "BACKEND_UNCONFIRMED", checkedAt };
        if (json.decision === "unavailable") {
            if (json.available !== false || !Array.isArray(json.reasons)) return UNCONFIRMED("BAD_UNAVAILABLE");
            const reasons = json.reasons.filter((r) => r && typeof r === "object" && typeof r.code === "string").map((r) => ({ code: r.code, message: typeof r.message === "string" ? r.message : "" }));
            if (!reasons.length) return UNCONFIRMED("NO_REASONS");
            return { state: "unavailable", reasons, currency, checkedAt };
        }
        // quoted
        if (json.available !== true || !currency || !isMoney(json.total) || !isMoney(json.nightlyAverage)) return UNCONFIRMED("BAD_QUOTE");
        if (!Array.isArray(json.breakdown) || !json.breakdown.length) return UNCONFIRMED("BAD_BREAKDOWN");
        const breakdown = [];
        let sum = 0;
        for (const b of json.breakdown) {
            if (!b || typeof b !== "object" || typeof b.type !== "string" || typeof b.label !== "string" || typeof b.total !== "number" || !Number.isFinite(b.total)) return UNCONFIRMED("BAD_BREAKDOWN_ITEM");
            breakdown.push({ type: b.type, label: b.label, total: b.total });
            sum += b.total;
        }
        // Backend contract (F3): breakdown lines are the included components and sum to total.
        if (Math.abs(Math.round(sum * 100) / 100 - Math.round(json.total * 100) / 100) > 0.01) return UNCONFIRMED("BREAKDOWN_SUM");
        const quoted = { state: "quoted", currency, total: json.total, nightlyAverage: json.nightlyAverage, nights: json.nights, breakdown, checkedAt, note: typeof json.note === "string" ? json.note : "" };
        quoted.direct = parseDirectEstimate(json.direct, quoted);
        if (json.direct !== undefined && !quoted.direct) console.warn("[quote] direct estimate ignored (malformed or inconsistent)");
        return quoted;
    }

    // ---- D4: Book Direct savings (display only) ----
    // The proxy attaches `direct` to a quoted stay. Every figure is calculated by the
    // server (integer centavos, server-side policy); the browser only checks that the
    // numbers are internally consistent with the standard quote and displays them.
    // Anything missing, malformed or inconsistent => standard price only.
    const DIRECT_NOTE = "Estimated direct-booking total. Final price confirmed at checkout.";
    const toCents = (v) => Math.round(v * 100);
    function parseDirectEstimate(d, quote) {
        if (!d || typeof d !== "object" || d.estimate !== true) return null;
        if (d.status === "estimate_unavailable") {
            if (d.currency !== quote.currency) return null;
            return { status: "estimate_unavailable", reason: typeof d.reason === "string" ? d.reason : "" };
        }
        if (d.status !== "estimated") return null;
        if (d.currency !== quote.currency) return null;
        const money = ["standardTotal", "eligibleAccommodation", "discount", "estimatedTotal"];
        if (!money.every((k) => isMoney(d[k]))) return null;
        if (typeof d.policyVersion !== "string" || !d.policyVersion) return null;
        if (!Number.isInteger(d.rateBps) || d.rateBps < 0 || d.rateBps > 5000) return null;
        const std = toCents(d.standardTotal), elig = toCents(d.eligibleAccommodation), disc = toCents(d.discount), est = toCents(d.estimatedTotal);
        if (std !== toCents(quote.total)) return null;                       // must describe THIS standard quote
        if (!(disc <= elig && elig <= std)) return null;
        if (est !== std - disc) return null;                                // consistency check only, never a recalculation
        if (disc === 0) return null;                                        // nothing to show as a saving
        return { status: "estimated", currency: d.currency, standardTotal: d.standardTotal, discount: d.discount, estimatedTotal: d.estimatedTotal, policyVersion: d.policyVersion, rateBps: d.rateBps };
    }
    const directPctLabel = (bps) => `${new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(bps / 100)}%`;

    async function fetchQuote(req) {
        if (!API_BASE) return UNCONFIRMED("NO_BACKEND");
        try {
            const qs = new URLSearchParams({ id: String(req.id), from: req.from, to: req.to, guests: String(req.guests) });
            const response = await fetch(`${API_BASE}/api/booking/quote?${qs}`, { method: "GET", cache: "no-store" });
            if (!response.ok) return UNCONFIRMED(`HTTP_${response.status}`);
            return parseQuoteResponse(await response.json(), req);
        } catch (err) {
            console.error("Quote request failed:", err);
            return UNCONFIRMED("FETCH_FAILED");
        }
    }
    const currentGuests = () => parseInt($("mvGuests").value, 10) || 1;

    /** Invalidate every in-flight quote (search and modal) and drop cached quotes. Called on any date/guest/search change. */
    function invalidateQuotes() {
        searchSeq += 1;
        resultsKey = null; // UX7b1: shown search prices no longer belong to the committed values
        modalQuoteSeq += 1;
        quoteByListing.clear();
        const sel = String(window.mvSelectedApartmentId || "");
        if (sel && $modal.getAttribute("aria-hidden") === "false") renderModalQuote(sel);
    }

    async function requestModalQuote(id) {
        const sel = selectionByListing.get(String(id));
        if (!sel || !sel.start || !sel.end) return;
        const req = { id: Number(id), from: sel.start, to: sel.end, guests: currentGuests() };
        const key = `${req.from}|${req.to}|${req.guests}`;
        const seq = ++modalQuoteSeq;
        quoteByListing.set(String(id), { key, result: { state: "loading" } });
        renderModalQuote(id);
        const result = await fetchQuote(req);
        // Discard if superseded (new selection / guests / listing) or the modal moved on.
        if (seq !== modalQuoteSeq || String(window.mvSelectedApartmentId) !== String(id)) return;
        const cur = selectionByListing.get(String(id));
        if (!cur || `${cur.start}|${cur.end}|${currentGuests()}` !== key) return;
        quoteByListing.set(String(id), { key, result });
        renderModalQuote(id);
    }

    function renderModalQuote(id) {
        const box = $("mvHostawayQuote");
        if (!box) return;
        if (String(window.mvSelectedApartmentId) !== String(id)) return;
        box.innerHTML = "";
        box.classList.remove("is-direct");
        const sel = selectionByListing.get(String(id));
        const entry = quoteByListing.get(String(id));
        if (!sel || !sel.start || !sel.end || !entry) return;
        if (entry.key !== `${sel.start}|${sel.end}|${currentGuests()}`) return; // stale for the current selection
        const r = entry.result;
        const line = (txt, cls) => { const el = document.createElement("div"); el.textContent = txt; if (cls) el.className = cls; box.appendChild(el); return el; };
        if (r.state === "loading") { line("Checking price…"); return; }
        if (r.state === "quoted") {
            const stay = `${r.nights} night${r.nights === 1 ? "" : "s"} · ${currentGuests()} guest${currentGuests() === 1 ? "" : "s"}`;
            const d = r.direct && r.direct.status === "estimated" ? r.direct : null;
            if (d) {
                box.classList.add("is-direct");
                const head = line(`${fmtMoney(d.estimatedTotal, d.currency)}`, "mv-quote__direct");
                head.setAttribute("aria-label", `Estimated direct total ${fmtMoney(d.estimatedTotal, d.currency)}`);
                const sub = document.createElement("span"); sub.className = "mv-quote__directlabel"; sub.textContent = " estimated direct total"; head.appendChild(sub);
                line(`Standard price: ${fmtMoney(d.standardTotal, d.currency)} · ${fmtMoney(r.nightlyAverage, r.currency)}/night · ${stay}`, "mv-quote__line mv-quote__std");
                r.breakdown.forEach((b) => line(`${b.label}: ${fmtMoney(b.total, r.currency)}`, "mv-quote__line mv-quote__sub"));
                line(`Estimated Book Direct savings (${directPctLabel(d.rateBps)}): −${fmtMoney(d.discount, d.currency)}`, "mv-quote__line mv-quote__save");
                line(`Estimated direct total: ${fmtMoney(d.estimatedTotal, d.currency)}`, "mv-quote__line mv-quote__esttotal");
                line(DIRECT_NOTE, "mv-quote__note mv-quote__directnote");
            } else {
                box.classList.remove("is-direct");
                line(`${fmtMoney(r.total, r.currency)} total · ${fmtMoney(r.nightlyAverage, r.currency)}/night · ${stay}`, "mv-quote__total");
                r.breakdown.forEach((b) => line(`${b.label}: ${fmtMoney(b.total, r.currency)}`, "mv-quote__line"));
                if (r.direct && r.direct.status === "estimate_unavailable") line("A Book Direct savings estimate is not available for this stay; the standard price above applies.", "mv-quote__note");
            }
            line(`Checked ${r.checkedAt ? new Date(r.checkedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "just now"}. ${r.note || "Quote only — no inventory is held."}`, "mv-quote__note");
            return;
        }
        if (r.state === "unavailable") {
            line("Not available for these dates and guests:", "mv-hcal__warn");
            r.reasons.forEach((x) => line(`• ${x.message || x.code}`, "mv-hcal__warn"));
            return;
        }
        const u = line("Price and availability could not be confirmed. ", "mv-hcal__warn");
        const retry = document.createElement("button");
        retry.type = "button"; retry.className = "mv-btn mv-btn--ghost"; retry.textContent = "Retry";
        retry.addEventListener("click", () => requestModalQuote(id));
        u.appendChild(retry);
    }

    /** Search bar: one quote per visible Hostaway card for the search dates/guests. */
    async function quoteHostawayCards(cards, checkIn, checkOut, guests, seq) {
        const results = new Map(); // id -> parsed result
        for (const card of cards) {
            if (seq !== searchSeq) return null; // superseded: stop, caller leaves the UI cleared
            const id = Number(card.dataset.apartmentId);
            const result = await fetchQuote({ id, from: checkIn, to: checkOut, guests });
            if (seq !== searchSeq) return null;
            results.set(id, result);
            const subtitle = card.querySelector(".mv-card__meta span:last-child");
            card.classList.remove("is-unconfirmed");
            if (result.state === "quoted") {
                card.style.display = "";
                const d = result.direct && result.direct.status === "estimated" ? result.direct : null;
                if (subtitle && d) {
                    subtitle.textContent = "";
                    subtitle.classList.add("mv-card__direct");
                    const main = document.createElement("strong"); main.className = "mv-card__directprice"; main.textContent = `${fmtMoney(d.estimatedTotal, d.currency)} est. direct total`;
                    const save = document.createElement("span"); save.className = "mv-card__directsave"; save.textContent = `Save ${fmtMoney(d.discount, d.currency)} (${directPctLabel(d.rateBps)}) · standard ${fmtMoney(d.standardTotal, d.currency)}`;
                    subtitle.append(main, save);
                } else if (subtitle) {
                    subtitle.classList.remove("mv-card__direct");
                    subtitle.textContent = `from ${fmtMoney(result.nightlyAverage, result.currency)}/night · ${fmtMoney(result.total, result.currency)} total`;
                }
            } else if (result.state === "unavailable") {
                card.style.display = "none";
                if (subtitle) subtitle.classList.remove("mv-card__direct");
                if (subtitle) subtitle.textContent = "Not available for these dates"; // never leave the transient "Checking…" behind (U5a)
            } else {
                card.style.display = "";
                card.classList.add("is-unconfirmed");
                if (subtitle) { subtitle.classList.remove("mv-card__direct"); subtitle.textContent = "Availability unknown — try again"; }
            }
        }
        return results;
    }

    function renderHostawaySearchSummary(results, cards) {
        const quoted = [...results.values()].filter((r) => r.state === "quoted");
        const unavailable = [...results.entries()].filter(([, r]) => r.state === "unavailable");
        const unconfirmed = [...results.values()].filter((r) => r.state === "unconfirmed");
        // Visible results message: rejection reasons (hidden cards cannot show them) + unknown notice.
        const parts = [];
        unavailable.forEach(([id, r]) => {
            const p = PROPERTIES.find((x) => Number(x.id) === Number(id));
            parts.push(`${p ? p.name : id}: ${r.reasons.map((x) => x.message || x.code).join(" ")}`);
        });
        if (unconfirmed.length) parts.push(`${unconfirmed.length} propert${unconfirmed.length === 1 ? "y" : "ies"} could not be checked — try again.`);
        $msg.textContent = parts.join(" · ");
        // Footer: minimum nightly per currency, never across currencies.
        if (quoted.length) {
            const byCurrency = new Map();
            quoted.forEach((r) => byCurrency.set(r.currency, Math.min(byCurrency.get(r.currency) ?? Infinity, r.nightlyAverage)));
            const from = [...byCurrency.entries()].map(([c, v]) => `from ${fmtMoney(v, c)}/night`).join(" · ");
            $availabilityStatus.textContent = `Available · ${from}${unconfirmed.length ? " · some properties could not be checked" : ""}`;
        } else if (unconfirmed.length) {
            $availabilityStatus.textContent = "Availability could not be confirmed for these dates — try again";
        } else if (results.size === cards.length && cards.length) {
            $availabilityStatus.textContent = "No availability for these dates";
        } else {
            $availabilityStatus.textContent = "";
        }
        $availabilityPrice.textContent = "";
    }

    const $ = (id) => document.getElementById(id);

    const $calendarModal = $("mvCalendarModal");

    const $calendarClose = $("mvCalendarClose");

    const setFavs = (set) => localStorage.setItem(CONFIG.favoritesKey, JSON.stringify([...set]));

        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

    function normalizeSavedIds() {
        const raw = JSON.parse(localStorage.getItem(CONFIG.favoritesKey) || "[]").map(String);
        const normalized = raw.map((id) => {
            const match = PROPERTIES.find((p) => String(p.id) === id);
            return match ? getPropertyId(match) : id;
        });
        const unique = [...new Set(normalized)];
        localStorage.setItem(CONFIG.favoritesKey, JSON.stringify(unique));

    function showInventoryMessage(text, { retry = false } = {}) {
        $msg.textContent = text;

    let listingsSettled = false; // UX1: the property view shows "Loading property…" until the feed has answered
    async function loadListings() {
        listingsSettled = false;
        PROPERTIES = [];
        currentList = PROPERTIES;
        if (!API_BASE) {
            renderWithFilters();
            showInventoryMessage(UI_TEXT.noBackend);
            listingsSettled = true;
            renderRoute();
            return;
        }
        showInventoryMessage(UI_TEXT.loading);
        try {
            const response = await fetch(`${API_BASE}/api/booking/listings`, { method: "GET" });
            if (!response.ok) throw new Error(`listings ${response.status}`);
            const data = await response.json();
            if (!data || data.ok !== true || !Array.isArray(data.listings)) throw new Error("listings payload");
            const seen = new Set();
            PROPERTIES = data.listings
                .map(toProperty)
                .filter((p) => p && !seen.has(p.id) && seen.add(p.id));
            currentList = PROPERTIES;
            const note = $("mvCurrencyNote"); if (note) note.textContent = currencyNoteText(PROPERTIES);
            renderWithFilters();
            updateSavedCount(false);
            if (!PROPERTIES.length) showInventoryMessage(UI_TEXT.loadFailed, { retry: true });
            listingsSettled = true;
            renderRoute();
        } catch (err) {
            renderWithFilters();
            showInventoryMessage(UI_TEXT.loadFailed, { retry: true });

            listingsSettled = true;
            renderRoute();
