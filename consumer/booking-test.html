    function todayISO() {
        const t = new Date();
        t.setHours(0,0,0,0);
        return t.toISOString().slice(0,10);
    }

    function setMinDates() {
        const checkin = $("mvCheckin");
        const checkout = $("mvCheckout");
        const minIn = CONFIG.sameDayCheckin ? todayISO() : (() => {
            const t = new Date(); t.setDate(t.getDate()+1);
            return t.toISOString().slice(0,10);
        })();
        checkin.min = minIn;
        checkout.min = minIn;
    }

    function ensureCheckoutAfterCheckin() {
        const inVal = $("mvCheckin").value;
        const outVal = $("mvCheckout").value;
        if (!inVal) return;
        const inDate = new Date(inVal + "T00:00:00");
        const minOut = new Date(inDate); minOut.setDate(minOut.getDate()+1);
        const minOutISO = minOut.toISOString().slice(0,10);
        $("mvCheckout").min = minOutISO;

        if (outVal && outVal <= inVal) {
            $("mvCheckout").value = minOutISO;
        }
    }

    // UI calendar modal; writes to existing date inputs; core logic untouched.
    const $checkinInput = $("mvCheckin");
    const $checkoutInput = $("mvCheckout");
    let calendarStart = null;
    let calendarEnd = null;

    // N1/N2: calendar navigation policy shared by the main search picker and the property modal. UI display policy only — the backend
    // (calendar/quote) stays authoritative; Hostaway's observed ~366-day closure is
    // NOT a business rule, so the horizon is one clearly named, editable value.
    const CALENDAR_POLICY = Object.freeze({
        maxAdvanceDays: 365,   // how far ahead guests may pick dates (navigation + selectable days)
        maxStayNights: 90,     // backend-supported maximum stay (STAY_TOO_LONG above this)
        visibleMonths: 2
    });
    let calendarViewMonth = null; // Date: first day of the LEFT visible month

    const parseISODate = (value) => {
        if (!value) return null;
        const [y, m, d] = value.split("-").map(Number);
        if (!y || !m || !d) return null;
        return new Date(y, m - 1, d);
    };
    const toISODate = (date) => {
        if (!date) return "";
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
    };
    const formatDisplayDate = (date) => new Intl.DateTimeFormat("en-US", {
        month: "short",
        day: "numeric"
    }).format(date);
    const updateDatesDisplay = () => {
        const inVal = $checkinInput.value;
        const outVal = $checkoutInput.value;
        if (inVal && outVal) {
            const inDate = parseISODate(inVal);
            const outDate = parseISODate(outVal);
            if (inDate && outDate) {
                $datesBtn.textContent = `${formatDisplayDate(inDate)} - ${formatDisplayDate(outDate)}`;
                $datesClear.style.display = "block";
                return;
            }
        }
        $datesBtn.textContent = "Add dates";
        $datesClear.style.display = "none";
    };
    const updateSearchBtnState = () => {
        const hasDates = Boolean($checkinInput.value && $checkoutInput.value);
        $searchBtn.disabled = !hasDates;
    };
    const clearDatesAndRefresh = () => {
        setInputValue($checkinInput, "");
        setInputValue($checkoutInput, "");
        $availabilityStatus.textContent = "";
        $availabilityPrice.textContent = "";
        updateDatesDisplay();
        updateSearchBtnState();
        renderWithFilters();
        updateSavedCount(false);
    };
    const setInputValue = (input, value) => {
        input.value = value;
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
    };
    const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
    const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
    const startOfToday = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
    const lastSelectableDate = (today) => new Date(today.getFullYear(), today.getMonth(), today.getDate() + CALENDAR_POLICY.maxAdvanceDays);
    const nightsBetweenDates = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
    /** Left-month bounds: never before the current month; right-hand month never after the last selectable month. */
    const viewBounds = () => {
        const today = startOfToday();
        const min = startOfMonth(today);
        const lastMonth = startOfMonth(lastSelectableDate(today));
        const maxLeft = addMonths(lastMonth, -(CALENDAR_POLICY.visibleMonths - 1));
        return { min, max: maxLeft < min ? min : maxLeft };
    };
    const clampViewMonth = (m) => { const { min, max } = viewBounds(); return m < min ? min : (m > max ? max : m); };
    const setCalendarNotice = (text) => { const el = $("mvCalendarNotice"); if (el) el.textContent = text || ""; };

    const renderCalendar = () => {
        const today = startOfToday();
        const lastDay = lastSelectableDate(today);
        const bounds = viewBounds();
        calendarViewMonth = clampViewMonth(calendarViewMonth || startOfMonth(today));
        $calendarMonths.innerHTML = "";
        const base = calendarViewMonth;
        const monthLabels = [];

        for (let offset = 0; offset < CALENDAR_POLICY.visibleMonths; offset += 1) {
            const monthDate = new Date(base.getFullYear(), base.getMonth() + offset, 1);
            const monthTitle = monthDate.toLocaleString("en-US", { month: "long", year: "numeric" });
            monthLabels.push(monthTitle);
            const firstDay = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1).getDay();
            const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();

            const monthEl = document.createElement("div");
            monthEl.className = "mv-cal__month";
            monthEl.innerHTML = `
                <div class="mv-cal__title">${monthTitle}</div>
                <div class="mv-cal__weekdays">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>
                <div class="mv-cal__grid"></div>
            `;
            const grid = monthEl.querySelector(".mv-cal__grid");
            for (let i = 0; i < firstDay; i += 1) {
                grid.appendChild(document.createElement("div"));
            }
            for (let day = 1; day <= daysInMonth; day += 1) {
                const date = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
                const isDisabled = date < today || date > lastDay; // past, or beyond the display horizon
                const isStart = calendarStart && toISODate(date) === toISODate(calendarStart);
                const isEnd = calendarEnd && toISODate(date) === toISODate(calendarEnd);
                const inRange = calendarStart && calendarEnd && date > calendarStart && date < calendarEnd;

                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "mv-cal__day";
                btn.textContent = String(day);
                btn.dataset.date = toISODate(date);
                const longDate = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }).format(date);
                const stateLabel = isDisabled ? (date < today ? ", past date" : ", too far ahead") : isStart ? ", check-in" : isEnd ? ", check-out" : inRange ? ", in selected stay" : "";
                btn.setAttribute("aria-label", longDate + stateLabel);
                if (isDisabled) { btn.classList.add("is-disabled"); btn.setAttribute("aria-disabled", "true"); }
                if (isStart) { btn.classList.add("is-start"); btn.setAttribute("aria-pressed", "true"); }
                if (isEnd) { btn.classList.add("is-end"); btn.setAttribute("aria-pressed", "true"); }
                if (inRange) btn.classList.add("is-inrange");
                grid.appendChild(btn);
            }
            $calendarMonths.appendChild(monthEl);
        }
        const range = $("mvCalRange");
        if (range) range.textContent = monthLabels.length > 1 ? `${monthLabels[0]} – ${monthLabels[monthLabels.length - 1]}` : monthLabels[0];
        const prev = $("mvCalPrev"), next = $("mvCalNext");
        if (prev) prev.disabled = calendarViewMonth <= bounds.min;
        if (next) next.disabled = calendarViewMonth >= bounds.max;
        updateCalendarFooter();
    };
    // ---- UX6: picker footer. Selection rules are unchanged; only the confirmation step moved into the picker. ----
    const DATES_CHANGED_NOTICE = "Dates changed. Check availability to update results.";
    let lastSearchKey = null; // ci|co|guests of the most recent search started (set by the search handler)
    const searchKeyNow = () => `${$checkinInput.value}|${$checkoutInput.value}|${$("mvGuests").value}`;
    function updateCalendarFooter() {
        const summary = $("mvCalSummary"), search = $("mvCalSearch");
        if (!summary || !search) return;
        const complete = !!(calendarStart && calendarEnd);
        if (complete) { const n = nightsBetweenDates(calendarStart, calendarEnd); summary.textContent = `${formatDisplayDate(calendarStart)} → ${formatDisplayDate(calendarEnd)} · ${n} night${n === 1 ? "" : "s"}`; }
        else summary.textContent = calendarStart ? `Check-in ${formatDisplayDate(calendarStart)} — choose a check-out date` : "Choose a check-in date";
        search.disabled = !complete;
    }
    /** Write a complete picker range to the search inputs (their change handlers clear any stale results), unless unchanged. */
    function commitCalendarRange() {
        if (!calendarStart || !calendarEnd) return false;
        const ci = toISODate(calendarStart), co = toISODate(calendarEnd);
        if ($checkinInput.value === ci && $checkoutInput.value === co) return false; // same range: results stay valid
        setInputValue($checkinInput, ci);
        setInputValue($checkoutInput, co);
        updateDatesDisplay();
        updateSearchBtnState();
        if (lastSearchKey) $availabilityStatus.textContent = DATES_CHANGED_NOTICE; // earlier results were cleared; say why
        return true;
    }
    /** Month navigation only changes the VIEW: no selection, search, quote, or network side effects. */
    const navigateCalendar = (delta) => {
        const target = clampViewMonth(addMonths(calendarViewMonth || startOfMonth(startOfToday()), delta));
        const moved = target.getTime() !== (calendarViewMonth && calendarViewMonth.getTime());
        const prev = $("mvCalPrev"), next = $("mvCalNext");
        const hadFocus = document.activeElement; // captured first: the browser drops focus as soon as a focused button is disabled
        calendarViewMonth = target;
        if (moved) setCalendarNotice("");
        renderCalendar();
        // A nav button that just became disabled loses focus; hand it to the other one (or the dialog).
        if (hadFocus === prev && prev.disabled) { if (!next.disabled) next.focus(); else $("mvCalendarPanel").focus(); }
        else if (hadFocus === next && next.disabled) { if (!prev.disabled) prev.focus(); else $("mvCalendarPanel").focus(); }
    };
    let calendarOpener = null;
    const openCalendar = () => {
        calendarStart = parseISODate($checkinInput.value);
        calendarEnd = parseISODate($checkoutInput.value);
        calendarViewMonth = clampViewMonth(startOfMonth(calendarStart || startOfToday()));
        setCalendarNotice("");
        renderCalendar();
        calendarOpener = document.activeElement;
        $calendarModal.setAttribute("aria-hidden", "false");
        const panel = $("mvCalendarPanel");
        if (panel) panel.focus();
    };
    const closeCalendar = () => {
        const wasOpen = $calendarModal.getAttribute("aria-hidden") === "false";
        $calendarModal.setAttribute("aria-hidden", "true");
        if (wasOpen && calendarOpener && typeof calendarOpener.focus === "function") calendarOpener.focus();
    };

    $datesBtn.addEventListener("click", openCalendar);
    $datesClear.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        clearDatesAndRefresh();
    });
    $calendarClose.addEventListener("click", closeCalendar);
    $("mvCalPrev").addEventListener("click", () => navigateCalendar(-1));
    $("mvCalNext").addEventListener("click", () => navigateCalendar(1));
    $calendarModal.addEventListener("keydown", (event) => {
        // Keyboard month paging while the picker is open (PageUp/PageDown), like common date pickers.
        if (event.key === "PageUp") { event.preventDefault(); navigateCalendar(-1); }
        else if (event.key === "PageDown") { event.preventDefault(); navigateCalendar(1); }
    });
    $calendarModal.addEventListener("click", (event) => {
        if (event.target.dataset.calClose) closeCalendar();
    });
    $calendarMonths.addEventListener("click", (event) => {
        const dayBtn = event.target.closest(".mv-cal__day");
        if (!dayBtn || dayBtn.classList.contains("is-disabled")) return;
        const picked = parseISODate(dayBtn.dataset.date);
        if (!calendarStart || (calendarStart && calendarEnd)) {
            calendarStart = picked;
            calendarEnd = null;
            setCalendarNotice("");
            renderCalendar();
            return;
        }
        if (picked < calendarStart) {
            calendarStart = picked;
            calendarEnd = null;
            setCalendarNotice("");
            renderCalendar();
            return;
        }
        if (nightsBetweenDates(calendarStart, picked) > CALENDAR_POLICY.maxStayNights) {
            // Beyond the backend's maximum stay: do not accept a check-out; start a new selection from this day.
            calendarStart = picked;
            calendarEnd = null;
            setCalendarNotice(`Stays are limited to ${CALENDAR_POLICY.maxStayNights} nights. Check-in is now ${formatDisplayDate(picked)} — choose a check-out date.`);
            renderCalendar();
            return;
        }
        calendarEnd = picked;
        commitCalendarRange(); // UX6: commit, but keep the picker open showing the range (no search, no request)
        setCalendarNotice("");
        renderCalendar();
    });
    // UX6: footer actions
    $("mvCalSearch").addEventListener("click", () => {
        const btn = $("mvCalSearch");
        if (btn.disabled || !calendarStart || !calendarEnd) return;
        btn.disabled = true; // one confirmation per click; re-enabled by the next render
        commitCalendarRange();
        closeCalendar();
        if (!$searchBtn.disabled) { $searchBtn.click(); return; } // the existing search, exactly once
        if (searchKeyNow() === lastSearchKey) return;             // that exact search is already running
        const waitThenSearch = () => { if ($searchBtn.disabled) { setTimeout(waitThenSearch, 50); return; } $searchBtn.click(); };
        waitThenSearch(); // a superseded search is still unwinding; start the new one as soon as it has
    });
    $("mvCalClear").addEventListener("click", () => {
        calendarStart = null; calendarEnd = null;
        setCalendarNotice("");
        if ($checkinInput.value || $checkoutInput.value) clearDatesAndRefresh(); // inputs, pill, stale results; no API call
        renderCalendar();
    });
    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeCalendar();
    });

    function ensureSelectedPropertyId(list) {
        if (!list.length) {
            selectedPropertyId = "";
            return;
        }
        const ids = new Set(list.map((p) => getPropertyId(p)));
        if (!selectedPropertyId || !ids.has(selectedPropertyId)) {
            selectedPropertyId = getPropertyId(list[0]);
        }
    }

    function renderCards(list) {
        ensureSelectedPropertyId(list);
        const favs = getFavs();

        // Standalone cards, one flat grid. The former Smoobu parent/child grouping
        // (which hid any property outside "Casa Victoria"/"Vista Victoria") is gone.
        // Card markup and classes are unchanged; values are escaped.
        const cardMarkup = (p) => {
            const pid = getPropertyId(p);
            const saved = favs.has(pid);
            const image = p.img
                ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="eager"
                         onerror="this.onerror=null;this.style.opacity=0.7;this.style.filter='grayscale(1)';">`
                : `<div class="mv-card__noimg" role="img" aria-label="No photo available"></div>`;
            const subtitle = "Select dates to see price &amp; availability";
            // UX7a: photo and title are real links to the dedicated property page (new tab / copy link work natively).
            // The title link is the card's single keyboard/AT target; the photo link duplicates it for pointers only.
            const href = esc(propertyCardHref(p));
            return `
            <div class="mv-card" data-id="${p.id}" data-property-id="${esc(pid)}" data-apartment-id="${p.id}" data-source="${esc(p.source || "")}">
                <button type="button" class="mv-heart${saved ? " is-saved" : ""}" data-heart="1" data-id="${p.id}" data-property-id="${esc(pid)}" data-on="${saved ? 1 : 0}" aria-label="${esc(heartLabel(p.name, saved))}">
                    ${saved ? "♥" : "♡"}
                </button>
                <a class="mv-card__media" href="${href}" data-card-link="1" tabindex="-1" aria-hidden="true">${image}</a>
                <div class="mv-card__body">
                    <div class="mv-card__title"><a class="mv-card__link" href="${href}" data-card-link="1">${esc(p.name)}</a></div>
                    <div class="mv-card__meta">
                        <span>Sleeps ${p.sleeps}</span>
                        <span>${subtitle}</span>
                    </div>
                    <div class="mv-card__tag">${esc(p.tagline || "")}</div>
                </div>
            </div>
        `;
        };

        $results.classList.remove("mv-grouped");
        $results.innerHTML = list.map(cardMarkup).join("");
    }

    function updateSavedCount(isActive = false) {
        const count = getFavs().size;
        $showSaved.textContent = `Saved (${count})`;
        $showSaved.classList.toggle("is-active", isActive);
        $showAll.classList.toggle("is-active", !isActive);
    }

    function renderWithFilters() {
        if (!savedFilterActive) {
            renderCards(currentList);
            const count = currentList.length;
            if (count) {
                $msg.textContent = "";
            } else if (!PROPERTIES.length) {
                // Inventory itself is empty: keep the inventory status message (set by loadListings).
                if (!$msg.textContent) $msg.textContent = API_BASE ? UI_TEXT.loadFailed : UI_TEXT.noBackend;
            } else {
                $msg.textContent = "No properties available for these dates.";
            }
            return;
        }

        const favs = getFavs();
        const saved = currentList.filter(p => favs.has(getPropertyId(p)));
        renderCards(saved);
        const count = saved.length;
        $msg.textContent = count
            ? ""
            : "No saved properties yet";
    }

    function openModal(p) {
        const checkin = $("mvCheckin").value;
        const checkout = $("mvCheckout").value;
        const guests = $("mvGuests").value;
        // Inventory is Hostaway-only (toProperty() is the single source). The
        // guard is kept defensively: an unknown source gets no calendar or price.
        const isHostaway = p.source === "hostaway";

        const modalImage = p.img
            ? `<img class="mv-modal__img" src="${esc(p.img)}" alt="${esc(p.name)}" loading="eager"
                             onerror="this.onerror=null;this.style.opacity=0.7;this.style.filter='grayscale(1)';">`
            : `<div class="mv-modal__img mv-card__noimg" role="img" aria-label="No photo available"></div>`;
        const modalNote = isHostaway
            ? `Pick a check-in night and a check-out day on the calendar, then check the price. Prices come from the property management system and are shown in ${currencyLabel(p.currency) || "the property's listed currency"}.`
            : "Live availability and pricing are not connected for this property.";
        const modalLink = p.url ? `<a class="mv-link" href="${esc(p.url)}" target="_blank" rel="noopener">Open full property page →</a>` : "";
        // U2: read-only live calendar for Hostaway listings (per-listing state, departure-exclusive).
        const modalCalendar = isHostaway ? `
                    <div class="mv-hcal" id="mvHostawayCalendar" aria-live="polite" tabindex="-1">
                        <div class="mv-hcal__status" id="mvHostawayCalendarStatus"></div>
                        <div class="mv-calendar__nav mv-hcal__nav">
                            <button id="mvHcalPrev" class="mv-calendar__navbtn" type="button" aria-label="Previous month">&#8249;</button>
                            <div id="mvHcalRange" class="mv-calendar__range"></div>
                            <button id="mvHcalNext" class="mv-calendar__navbtn" type="button" aria-label="Next month">&#8250;</button>
                        </div>
                        <div class="mv-hcal__legend" id="mvHostawayCalendarLegend">
                            <span><i class="mv-hcal__swatch"></i>Available night</span>
                            <span><i class="mv-hcal__swatch is-blocked"></i>Unavailable night</span>
                            <span><i class="mv-hcal__swatch is-unknown"></i>Not confirmed</span>
                        </div>
                        <div class="mv-calendar__months mv-hcal__months" id="mvHostawayCalendarMonths"></div>
                        <div class="mv-hcal__selection" id="mvHostawaySelection"></div>
                        <div class="mv-quote" id="mvHostawayQuote" aria-live="polite"></div>
                    </div>` : "";

        $modalContent.innerHTML = `
            <div class="mv-modal__content">
                <div>

            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
    }, true);

    // ---- UX3: compact booking panel on the property page (display + validation only; no checkout) ----
    // Reuses the validated booking engine exactly as the modal does, in the same order:
    //   seedSelectionFromSearch()  -> the modal's carry-over validation of the shared search dates
    //   fetchCalendarWindow() + evaluateStaySelection()  -> fresh stay-window occupancy check (fail closed)
    //   fetchQuote()  -> parseQuoteResponse() + parseDirectEstimate() (server bookability, capacity, D4 consistency)
    // It has its OWN state (panelSeq token) and its OWN ids (mvPanel*). It never reads or writes the modal's
    // selectionByListing / calendarByListing / quoteByListing / window.mvSelectedApartmentId, so the search modal
    // keeps its single active booking state. Every async step checks the token, the route and that its DOM is still
    // attached, so a late answer can never update another property or view. Nothing here computes a price.
    let panelSeq = 0;
    const PANEL_TEXT = {
        selectDates: "Select dates to see price",
        checking: "Checking availability and price…",
        unavailable: "Not available for these dates",
        unconfirmed: "Availability could not be confirmed",
        priceUnconfirmed: "Price could not be confirmed",
        soon: "Online booking for this property opens soon.",
        chooseGuests: "Choose the number of guests to see a price",       // UX7b1
        guestsLinkInvalid: "The guest count in this link couldn't be used. Choose the number of guests above.",
        datesLinkInvalid: "The dates in this link couldn't be used. Choose new dates above.",
        capacityHead: "Choose fewer guests to see a price"
    };
    const fmtLongDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric" }).format(new Date(y, m - 1, d)); };
    const panelLive = () => routeView === "property";
    /** UX5: commit a new guest count from the panel. Same committed state as dates (the shared search input), URL via
     *  replaceState, then the panel is rebuilt: the old price disappears at once and the existing UX3 pipeline re-runs.
     *  Each rebuild bumps panelSeq, so with rapid changes only the latest count can ever be displayed. */
    function commitPanelGuests(p, sel) {
        const v = Number(sel.value);
        const shared = $("mvGuests");
        const allowed = Number.isInteger(v) && v >= 1 && v <= p.sleeps && [...shared.options].some((o) => o.value === String(v));
        if (!allowed) { sel.value = guestsParamInvalid ? "" : String(currentGuests()); return; } // never accept a count above verified capacity
        if (v === currentGuests() && !guestsParamInvalid) return;        // same value: no requote (unless it confirms an unusable link value)
        guestsParamInvalid = false; guestsParamRaw = null;               // UX7b1: the guest has now chosen a count
        shared.value = String(v);
        shared.dispatchEvent(new Event("change", { bubbles: true }));    // search page mirrors it (runSearch invalidates search quotes)
        history.replaceState(history.state, "", window.location.pathname + searchQueryString());
        panelSeq += 1;
        const card = $("mvPanel");
        if (card) card.replaceWith(buildBookingPanel(p));
        const again = $("mvPanelGuestsSelect"); if (again) again.focus();
    }
    function buildBookingPanel(p) {
        const seq = ++panelSeq;
        const card = document.createElement("div"); card.className = "mv-prop__card mv-panel"; card.id = "mvPanel";
        const live = document.createElement("div"); live.className = "mv-panel__live"; live.id = "mvPanelLive"; live.setAttribute("aria-live", "polite");
        const statusBox = document.createElement("div"); statusBox.className = "mv-panel__statusbox"; statusBox.id = "mvPanelStatus"; statusBox.setAttribute("aria-live", "polite");
        const fields = document.createElement("dl"); fields.className = "mv-panel__fields";
        const field = (id, label, value, cls, onClick) => {
            const box = document.createElement("div"); box.className = `mv-panel__field ${cls || ""}`.trim();
            const dt = document.createElement("dt"); dt.textContent = label; const dd = document.createElement("dd");
            if (onClick) { // UX4b: date fields open the on-page editor
                const b = document.createElement("button"); b.type = "button"; b.id = id; b.textContent = value; b.setAttribute("aria-haspopup", "dialog"); b.setAttribute("aria-label", `${label}: ${value}. Change dates`);
                if (value === "Add date") b.classList.add("is-empty");
                b.addEventListener("click", () => onClick(b)); dd.appendChild(b);
            } else { dd.id = id; dd.textContent = value; }
            box.append(dt, dd); fields.appendChild(box); return dd;
        };
        const seed = seedSelectionFromSearch(); // same validation the modal applies to carried-over search dates
        const guests = currentGuests();
        const hasDates = seed.ok;
        field("mvPanelCheckin", "Check-in", hasDates ? fmtLongDate(seed.start) : "Add date", "mv-panel__field--in", (b) => openDateEditor(p, b, "checkin"));
        field("mvPanelCheckout", "Checkout", hasDates ? fmtLongDate(seed.end) : "Add date", "mv-panel__field--out", (b) => openDateEditor(p, b, "checkout"));
        // UX5: guest count = a native select laid over the field (the visible text stays the same compact design).
        // Options are 1..verified capacity; a larger committed count (e.g. from a shared URL) is shown as a disabled,
        // flagged option so it is never silently accepted and can be corrected here. The backend stays authoritative.
        const guestsUnconfirmed = guestsParamInvalid; // UX7b1: the link's guest value was unusable; nothing is assumed
        const guestsDd = field("mvPanelGuests", "Guests", guestsUnconfirmed ? "Choose guests" : `${guests} guest${guests === 1 ? "" : "s"}`, "mv-panel__field--guests");
        const overCapacity = !guestsUnconfirmed && guests > p.sleeps;
        guestsDd.parentElement.classList.toggle("is-over", overCapacity || guestsUnconfirmed);
        guestsDd.setAttribute("aria-hidden", "true"); // the select below carries the accessible name and value
        const guestSel = document.createElement("select"); guestSel.id = "mvPanelGuestsSelect"; guestSel.className = "mv-panel__guestsel";
        guestSel.setAttribute("aria-label", "Guests");
        for (let n = 1; n <= p.sleeps; n += 1) { const o = document.createElement("option"); o.value = String(n); o.textContent = `${n} guest${n === 1 ? "" : "s"}`; guestSel.appendChild(o); }
        if (overCapacity) { const o = document.createElement("option"); o.value = String(guests); o.textContent = `${guests} guests (more than this property sleeps)`; o.disabled = true; guestSel.appendChild(o); }
        if (guestsUnconfirmed) { const o = document.createElement("option"); o.value = ""; o.textContent = "Choose guests"; o.disabled = true; guestSel.prepend(o); }
        guestSel.value = guestsUnconfirmed ? "" : String(guests);
        guestSel.addEventListener("change", () => commitPanelGuests(p, guestSel));
        guestsDd.parentElement.appendChild(guestSel);
        const extra = document.createElement("div"); extra.className = "mv-panel__extra";
        const note = document.createElement("div"); note.className = "mv-prop__note"; note.textContent = PANEL_TEXT.soon;
        card.append(live, fields, statusBox, extra, note);

        const current = () => seq === panelSeq && panelLive() && card.isConnected;
        const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
        const head = (text, cls) => { live.innerHTML = ""; statusBox.innerHTML = ""; extra.innerHTML = ""; card.dataset.state = cls; live.appendChild(el("div", `mv-panel__head mv-panel__head--${cls}`, text)); };
        const retryButton = () => { const b = el("button", "mv-btn mv-btn--ghost mv-panel__retry", "Retry"); b.type = "button"; b.id = "mvPanelRetry"; b.addEventListener("click", () => { if (!current()) return; panelSeq += 1; card.replaceWith(buildBookingPanel(p)); }); return b; };

        // UX7b1: while the committed count exceeds capacity, this correction is appended last in EVERY state (missing
        // dates, checking, calendar failure, unavailable, unconfirmed, quote failure) and no price is ever rendered.
        const capacityHint = () => { if (overCapacity) statusBox.appendChild(el("div", "mv-panel__status mv-panel__status--hint", `This property sleeps up to ${p.sleeps} guest${p.sleeps === 1 ? "" : "s"}. Choose fewer guests above.`)); };
        if (guestsUnconfirmed) { // no calendar or quote request until the guest picks a count
            head(PANEL_TEXT.chooseGuests, "guests");
            statusBox.appendChild(el("div", "mv-panel__status mv-panel__status--hint", PANEL_TEXT.guestsLinkInvalid));
            if (!hasDates && datesParamInvalid) statusBox.appendChild(el("div", "mv-panel__status", PANEL_TEXT.datesLinkInvalid));
            return card;
        }
        if (!hasDates) {
            head(PANEL_TEXT.selectDates, "empty");
            if (seed.invalid) statusBox.appendChild(el("div", "mv-panel__status", seed.message));
            else if (datesParamInvalid) statusBox.appendChild(el("div", "mv-panel__status", PANEL_TEXT.datesLinkInvalid));
            capacityHint();
            return card;
        }
        head(PANEL_TEXT.checking, "loading");
        capacityHint();
        (async () => {
            // 1) fresh occupancy check for exactly this stay (arrival-inclusive / departure-exclusive), fail closed
            const cal = await fetchCalendarWindow(p.id, seed.start, seed.end);
            if (!current()) return;
            const v = evaluateStaySelection(seed.start, seed.end, cal, toISODate(new Date()));
            if (!v.ok) {
                if (v.reason === "NIGHT_UNAVAILABLE") {
                    head(PANEL_TEXT.unavailable, "unavailable");
                    statusBox.appendChild(el("div", "mv-panel__status", `${SELECTION_TEXT.NIGHT_UNAVAILABLE} (${fmtShort(v.night)}).`));
                } else {
                    head(PANEL_TEXT.unconfirmed, "unconfirmed");
                    const s = el("div", "mv-panel__status", `${SELECTION_TEXT[v.reason] || "Some nights could not be confirmed."} `); s.appendChild(retryButton()); statusBox.appendChild(s);
                }
                capacityHint();
                return;
            }
            // 2) server quote: bookability, restrictions, capacity, price and the D4 estimate (validated by parseQuoteResponse)
            const req = { id: Number(p.id), from: seed.start, to: seed.end, guests };
            const r = await fetchQuote(req);
            if (!current()) return;
            if (r.state === "unavailable") {
                head(PANEL_TEXT.unavailable, "unavailable");
                r.reasons.forEach((x) => statusBox.appendChild(el("div", "mv-panel__status", x.message || x.code)));
                capacityHint();
                return;
            }
            if (r.state !== "quoted") {
                head(PANEL_TEXT.priceUnconfirmed, "unconfirmed");
                const s = el("div", "mv-panel__status", "Please try again. "); s.appendChild(retryButton()); statusBox.appendChild(s);
                capacityHint();
                return;
            }
            if (overCapacity) { head(PANEL_TEXT.capacityHead, "capacity"); capacityHint(); return; } // defensive: never a price over capacity
            const nights = `${r.nights} night${r.nights === 1 ? "" : "s"}`;
            const d = r.direct && r.direct.status === "estimated" ? r.direct : null;
            live.innerHTML = ""; statusBox.innerHTML = ""; extra.innerHTML = ""; card.dataset.state = d ? "direct" : "quoted";
            const top = el("div", "mv-panel__top");
            if (d) {
                const std = el("div", "mv-panel__was", fmtMoney(d.standardTotal, d.currency)); std.setAttribute("aria-label", `Standard price ${fmtMoney(d.standardTotal, d.currency)}`);
                const price = el("div", "mv-panel__price", fmtMoney(d.estimatedTotal, d.currency)); price.id = "mvPanelPrice";
                const badge = el("span", "mv-panel__badge", `Save ${directPctLabel(d.rateBps)}`);
                top.append(std, price, badge);
                live.append(top, el("div", "mv-panel__sub", `Estimated direct total · ${nights}`));
            } else {
                const price = el("div", "mv-panel__price", fmtMoney(r.total, r.currency)); price.id = "mvPanelPrice";
                top.appendChild(price);
                live.append(top, el("div", "mv-panel__sub", `Total · ${nights} · ${fmtMoney(r.nightlyAverage, r.currency)}/night`));
            }
            statusBox.appendChild(el("div", "mv-panel__status mv-panel__status--ok", `Available for these dates · checked ${r.checkedAt && !Number.isNaN(Date.parse(r.checkedAt)) ? new Date(r.checkedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "just now"}`));
            // Breakdown (server lines), then the D4 figures exactly as the server sent them.
            const rows = el("dl", "mv-panel__rows"); rows.id = "mvPanelRows";
            const row = (k, val, cls) => { const w = el("div", `mv-panel__row ${cls || ""}`.trim()); w.append(el("dt", "", k), el("dd", "", val)); rows.appendChild(w); };
            if (r.breakdown.length > 1) r.breakdown.forEach((b) => row(b.label, b.total < 0 ? `−${fmtMoney(-b.total, r.currency)}` : fmtMoney(b.total, r.currency), "mv-panel__row--line"));
            if (d) {
                row("Standard total", fmtMoney(d.standardTotal, d.currency), "mv-panel__row--std");
                row(`Book Direct savings (${directPctLabel(d.rateBps)})`, `−${fmtMoney(d.discount, d.currency)}`, "mv-panel__row--save");
                row("Estimated direct total", fmtMoney(d.estimatedTotal, d.currency), "mv-panel__row--total");
            } else {
                row("Total", fmtMoney(r.total, r.currency), "mv-panel__row--total");
            }
            extra.appendChild(rows);
            const lead = d ? DIRECT_NOTE : (r.direct && r.direct.status === "estimate_unavailable" ? "A Book Direct savings estimate is not available for this stay; the standard price above applies." : "");
            extra.appendChild(el("div", "mv-panel__disclaimer", [lead, r.note || "Quote only — no inventory is held."].filter(Boolean).join(" ")));
        })();
        return card;
    }
    function showView(view) {
        routeView = view;
        $app.classList.toggle("mv-view-hidden", view === "property");
        $propertyView.classList.toggle("mv-view-hidden", view !== "property");
        if (view !== "property") document.title = baseTitle;
    }
    /** Render whatever the current location asks for. Safe to call repeatedly (boot, listings loaded, popstate). */
    function renderRoute() {
        const id = parsePropertyRoute(window.location.pathname);
        closeGallery({ restoreFocus: false }); // UX2b: a route change / re-render replaces the gallery the viewer belongs to
        panelSeq += 1; // UX3: any in-flight panel check belongs to the previous render and is discarded
        closeDateEditor({ restoreFocus: false }); // UX4b: the editor belongs to the view being replaced; its pending answers are dropped
        if (id === null) { if (routeView !== "search") showView("search"); return; }
        if ($modal.getAttribute("aria-hidden") === "false") closeModal(); // the modal belongs to the search view
        showView("property");
        renderPropertyView(id);
    }
    let routeQueryApplied = false;
    function applyRouteFromLocation({ focusTitle = false } = {}) {
        routeSeq += 1;
        const id = parsePropertyRoute(window.location.pathname);
        if (id !== null && !routeQueryApplied) { routeQueryApplied = true; applyRouteQuery(parseRouteQuery(window.location.search)); }
        focusTitlePending = focusTitle && id !== null;
        renderRoute();
    }
    function goBackToResults() {
        const st = window.history.state;
        if (st && st.mvFrom === "search") { window.history.back(); return; } // came from results in this document: restore it
        window.history.pushState({ mvView: "search" }, "", backToResultsHref());
        applyRouteFromLocation();
        onReturnToResults();
        window.scrollTo(0, 0);
    }
    window.addEventListener("popstate", (event) => {
        const fromView = routeView;
        applyRouteFromLocation({ focusTitle: true });
        if (fromView === "property" && routeView === "search") onReturnToResults();
        const st = event.state;
        if (routeView === "search" && st && typeof st.mvScrollY === "number") window.scrollTo(0, st.mvScrollY);
    });

    $("mvGuests").value = String(CONFIG.defaultGuests);
    setMinDates();
    ensureCheckoutAfterCheckin();
    currentList = PROPERTIES;
    renderWithFilters();
    updateSavedCount(false);
    // UX7b1: a results URL that states a search (e.g. after a refresh) initialises the inputs at load only (never on a
    // later Back/Forward, which must not overwrite newer committed values); no search request is made.
    if (parsePropertyRoute(window.location.pathname) === null && window.location.search) {
        applyRouteQuery(parseRouteQuery(window.location.search));
        guestsParamInvalid = false; guestsParamRaw = null; // the results form shows (and searches with) its visible guest count
        syncSearchUrl(true);
    }
    applyRouteFromLocation({ focusTitle: true }); // UX1: honour a direct /property/:id load (listings arrive asynchronously; renderRoute re-runs then)
})();
</script>

</body>
</html>
