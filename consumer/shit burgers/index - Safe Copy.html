<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maraVilla Booking UI v2</title>
  <style>
      .booking-modal {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.45);
        z-index: 1000;
        padding: 40px 20px;
        overflow-y: auto;
      }
      .booking-modal.active {
        display: flex;
      }
      .booking-modal__dialog {
        width: min(960px, 94vw);
        max-height: 82vh;
        background: #fff;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,.25);
        display: flex;
        align-items: stretch;
        position: relative;
      }

      .booking-modal__close {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 10;
        width: 44px;
        height: 44px;
        font-size: 24px;
        font-weight: bold;
        color: #ff385c;
        background: rgba(255,255,255,0.92);
        border: 1px solid #eee;
        border-radius: 50%;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background .18s, color .18s;
      }
      .booking-modal__close:hover {
        background: #ff385c;
        color: #fff;
        border-color: #ff385c;
      }
      .booking-modal__media {
        flex: 0 0 58%;
        min-width: 0;
        background: #f3f3f3;
      }
      .booking-modal__media img,
      .booking-modal__img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .booking-modal__content {
        flex: 1 1 42%;
        min-width: 320px;
        padding: 20px 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .booking-modal__content h2 {
        margin: 0 0 6px;
        font-size: 20px;
        line-height: 1.2;
      }
      .booking-modal__meta {
        margin: 0 0 10px;
        font-size: 14px;
        color: #555;
      }
    /* Airbnb-inspired UI Shell */
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
    }
    .mv-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 12px 40px;
    }
    .mv-search-bar {
      display: flex;
      gap: 0;
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      padding: 10px 18px;
      margin-bottom: 36px;
      align-items: center;
      border: none;
      min-height: 64px;
      max-width: 840px;
      margin-left: auto;
      margin-right: auto;
    }
    .mv-search-bar input[type="date"] {
      border: none;
      background: transparent;
      border-radius: 0;
      padding: 0 18px;
      font-size: 16px;
      outline: none;
      height: 44px;
      min-height: 44px;
      width: 170px;
      box-shadow: none;
      margin: 0;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .mv-search-bar select {
      border: none;
      background: transparent;
      border-radius: 0;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
      height: 44px;
      min-height: 44px;
      width: 110px;
      box-shadow: none;
      margin: 0 0 0 8px;
      flex: 0 0 110px;
      display: flex;
      align-items: center;
    }
    .mv-search-divider {
      width: 1px;
      height: 32px;
      background: #eee;
      margin: 0 10px;
      border-radius: 2px;
      display: inline-block;
    }
    .mv-search-btn {
      background: #ff385c;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 16px;
      min-width: 115px;
      height: 44px;
      box-shadow: 0 2px 8px rgba(255,56,92,0.13);
      transition: background-color 0.18s, box-shadow 0.18s, transform 0.18s;
      margin-left: 0;
      margin-right: 0;
      padding: 0 24px;
    }
    .mv-search-btn:hover {
      background: #e11d48;
      box-shadow: 0 6px 18px rgba(255,56,92,0.22);
      transform: translateY(-1px) scale(1.02);
    }
    .mv-search-btn:active {
      background: #c81e3a;
      box-shadow: 0 3px 10px rgba(255,56,92,0.18);
      transform: translateY(0px) scale(1.01);
    }
    .mv-clear-btn {
      background: #f7f7f7;
      color: #888;
      font-weight: 500;
      font-size: 15px;
      border: none;
      border-radius: 16px;
      min-width: 80px;
      height: 44px;
      margin-left: 16px;
      margin-right: 0;
      box-shadow: none;
      transition: background .18s;
      padding: 0 22px;
    }
    .mv-clear-btn:hover {
      background: #ececec;
      color: #222;
    }
    .mv-section {
      margin-bottom: 60px;
      margin-top: 32px;
    }
    .mv-section-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 22px;
      margin-top: 0;
      color: #222;
      letter-spacing: .01em;
    }
    .mv-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 320px));
      gap: 32px 24px;
      justify-content: start;
    }
    .mv-card {
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      border: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      height: 100%;
      position: relative;
      transition: box-shadow 0.18s, transform 0.18s;
      cursor: pointer;
    }
    .airbnb-card.listing-card {
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      border: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      height: 100%;
      position: relative;
      transition: box-shadow 0.18s, transform 0.18s;
      cursor: pointer;
    }
    .airbnb-card.listing-card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.16);
      transform: translateY(-4px) scale(1.015);
      z-index: 2;
    }
    .mv-card__img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
      background: #f6f6f6;
      transition: box-shadow 0.18s;
    }
    .airbnb-card.listing-card:hover .mv-card__img {
      transform: scale(1.04);
      transition: transform 0.18s;
    }
    .mv-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px 18px 0 0;
      transition: transform 0.18s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .mv-heart {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      background: rgba(255,255,255,0.85);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      font-size: 22px;
      color: #ff385c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow 0.18s, background 0.18s;
    }
    .mv-heart:hover {
      background: #fff;
      box-shadow: 0 4px 16px rgba(255,56,92,0.13);
    }
    .mv-card__body {
      padding: 20px 18px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mv-card__title {
      font-size: 19px;
      font-weight: 800;
      color: #222;
      margin-bottom: 0px;
      letter-spacing: .01em;
    }
    .mv-card__meta {
      font-size: 15px;
      color: #666;
      font-weight: 500;
      margin-bottom: 2px;
      letter-spacing: .01em;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      line-height: 1.4;
    }
    .mv-card__meta span {
      margin-right: 8px;
      white-space: nowrap;
    }
    .mv-card__price {
      color: #ff385c !important;
      font-weight: 800;
      font-size: 18px;
      margin-top: 8px;
      letter-spacing: .01em;
      line-height: 1.35;
    }
    .mv-card__price-secondary {
      color: #888;
      font-size: 14px;
      font-weight: 500;
      margin-top: 2px;
      letter-spacing: .01em;
      line-height: 1.2;
    }
    .mv-card__rating-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: #b48a00;
      margin-bottom: 2px;
      margin-top: 2px;
    }
    .mv-card__star {
      color: #ffb400;
      font-size: 15px;
      font-weight: 700;
      margin-right: 2px;
      display: flex;
      align-items: center;
    }
    .mv-card__rating {
      font-weight: 700;
      color: #222;
      font-size: 15px;
    }
    .mv-card__reviews {
      color: #888;
      font-size: 14px;
      font-weight: 500;
    }
    @media (max-width: 700px) {
      .mv-section-title {
        font-size: 18px;
        margin-bottom: 12px;
      }
      .mv-card-grid {
        gap: 16px;
      }
      .mv-card__body {
        padding: 10px 8px 12px 8px;
      }
    }
    @media (max-width: 480px) {
      .mv-container {
        padding: 8px 2px 24px;
      }
      .mv-search-bar {
        flex-direction: column;
        gap: 8px;
        padding: 12px 8px;
      }
      .mv-section-title {
        font-size: 15px;
      }
      .mv-card__body {
        padding: 8px 4px 8px 4px;
      }
    }
    .listing-card { cursor: pointer; }
    .booking-modal__form {
      display: grid;
      gap: 10px;
      margin-top: 6px;
    }
    .booking-modal__form label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .booking-modal__form input,
    .booking-modal__form select {
      width: 100%;
      height: 44px;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 14px;
      background: #fff;
      color: #111;
      box-sizing: border-box;
      outline: none;
    }
    .booking-modal__form input:focus,
    .booking-modal__form select:focus {
      border-color: #111;
    }
    .booking-modal__button,
    .booking-modal__cta {
      height: 46px;
      border: 0;
      border-radius: 999px;
      background: #ff385c;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 0 18px;
      cursor: pointer;
    }
    .mv-card__price {
      color: #000 !important;
      font-weight: 700;
      font-size: 16px;
      display: block;
      margin-top: 6px;
    }
    .booking-modal__link {
      font-size: 14px;
      color: #6b4eff;
      text-decoration: underline;
  </style>
</head>
<body>
  <div class="mv-container">
    <div class="mv-search-bar">
      <input type="date" placeholder="Check-in">
      <div class="mv-search-divider"></div>
      <input type="date" placeholder="Check-out">
      <div class="mv-search-divider"></div>
      <select>
        <option value="" disabled selected hidden>Guests</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
      </select>
      <div class="mv-search-divider"></div>
      <button class="mv-search-btn">Search</button>
      <button type="button" class="mv-clear-btn">Clear</button>
    </div>
    <div class="mv-section">
      <div class="mv-section-title">Casa Victoria</div>
      <div class="mv-card-grid">
        <!-- Mock cards for Casa Victoria -->
      </div>
    </div>
    <div class="mv-section">
      <div class="mv-section-title">Vista Victoria</div>
      <div class="mv-card-grid">
        <!-- Mock cards for Vista Victoria -->
      </div>
    </div>
  </div>
  <div class="booking-modal">
    <div class="booking-modal__backdrop"></div>
    <div class="booking-modal__dialog">
      <button class="booking-modal__close" aria-label="Close">×</button>
      <div class="booking-modal__media">
        <img class="booking-modal__img" src="" alt="Property image" />
      </div>
      <div class="booking-modal__content">
        <h2 class="booking-modal__title"></h2>
        <p class="booking-modal__meta"></p>
        <form class="booking-modal__form" autocomplete="off">
          <div class="booking-modal__row">
            <label>Check-in</label>
            <input type="date" name="checkin" required />
          </div>
          <div class="booking-modal__row">
            <label>Check-out</label>
            <input type="date" name="checkout" required />
          </div>
          <div class="booking-modal__row">
            <label>Guests</label>
            <select name="guests">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </div>
          <button type="submit" class="booking-modal__cta">Check availability</button>
        </form>
        <a class="booking-modal__link" href="#" target="_blank" rel="noopener">Open full property page</a>
      </div>
    </div>
  </div>
  <script>
        // Add clear/reset behavior for homepage state
        document.querySelector('.mv-clear-btn').addEventListener('click', function() {
          // Clear date inputs
          const checkinInput = document.querySelector('.mv-search-bar input[type="date"]:nth-child(1)');
          const checkoutInput = document.querySelector('.mv-search-bar input[type="date"]:nth-child(2)');
          const guestsSelect = document.querySelector('.mv-search-bar select');
          if (checkinInput) checkinInput.value = '';
          if (checkoutInput) checkoutInput.value = '';
          if (guestsSelect) guestsSelect.selectedIndex = 0;
          // Restore all properties visible and default card copy/pricing
          const grouped = groupUnitsByParent(PROPERTIES);
          document.querySelectorAll('.mv-section').forEach(section => {
            const title = section.querySelector('.mv-section-title').textContent;
            renderCards(section, grouped[title] || [], null, null);
          });
        });
    const API_BASE = "https://maravilla-smoobu-proxy.vercel.app";
    const PROPERTIES = [
      {
        id: 3155581,
        name: "Casa Victoria — Villa A",
        sleeps: 6,
        tagline: "2BR • 2 Bath • 1.5 blocks to the beach",
        img: "https://images.squarespace-cdn.com/content/v1/56c4c3281bbee0fde9e882cf/1726259424715-7Q01O05WF5VTOAGY4PFX/Casa%2BVictoria%2B-%2BApartment%2BD%2B008.jpg",
        url: "https://www.maravillanayarit.com/patio-villa-a",
        baseNightly: 220
      },
      {
        id: 3155591,
        name: "Casa Victoria — Villa C",
        sleeps: 6,
        tagline: "2BR • 2 Bath • Private balcony",
        img: "https://images.squarespace-cdn.com/content/v1/56c4c3281bbee0fde9e882cf/1639429044647-Q73Y374R2VURECZ1SGM9/PDP03935.jpg",
        url: "https://www.maravillanayarit.com/unit-c-upper",
        baseNightly: 180
      },
      {
        id: 3155586,
        name: "Casa Victoria — Villa D",
        sleeps: 6,
        tagline: "2BR • 2 Bath • Upper unit",
        img: "https://images.squarespace-cdn.com/content/v1/56c4c3281bbee0fde9e882cf/1639429152074-QH8ZZ2TNPNALMPDN3W8A/PDP03786.jpg",
        url: "https://www.maravillanayarit.com/unit-d-upper",
        baseNightly: 320
      },
      {
        id: 3155576,
        name: "Vista Victoria — Town House #1",
        sleeps: 8,
        tagline: "Townhome • Great for families",
        img: "https://images.squarespace-cdn.com/content/v1/56c4c3281bbee0fde9e882cf/1618930764543-DE7D7M9F3PWYIDWR51PK/DSC08761sm.jpg",
        url: "https://www.maravillanayarit.com/vista-victoria-town-house-1",
        baseNightly: 210
      }
    ];

    function groupUnitsByParent(units) {
      const groups = {
        "Casa Victoria": [],
        "Vista Victoria": []
      };
      units.forEach(unit => {
        if (unit.name.startsWith("Casa Victoria")) {
          groups["Casa Victoria"].push(unit);
        } else if (unit.name.startsWith("Vista Victoria")) {
          groups["Vista Victoria"].push(unit);
        }
      });
      return groups;
    }

    function formatPrice(unit, checkIn, checkOut) {
      // If no dates, show base nightly price
      if (!checkIn || !checkOut) {
        return `From $${unit.baseNightly || unit.nightlyPrice || '—'} / night`;
      }
      // If dates and total pricing available
      if (unit.totalPrice && unit.nights) {
        const text = `$${unit.totalPrice} total · ${unit.nights} nights`;
        console.log('[CARD SEARCH STATE]', unit.id, text);
        return text;
      }
      // If searched-state with nights and base nightly, compute UI-derived total
      let nights = unit.nights;
      if (!nights && checkIn && checkOut) {
        const inDate = new Date(checkIn);
        const outDate = new Date(checkOut);
        nights = Math.max(1, Math.round((outDate - inDate) / (1000 * 60 * 60 * 24)));
      }
      const nightly = unit.baseNightly || unit.nightlyPrice;
      if (checkIn && checkOut && nights > 0 && nightly) {
        const derivedTotal = nightly * nights;
        const text = `$${derivedTotal} total · ${nights} nights`;
        console.log('[FORMAT PRICE FINAL]', unit.id, {
          checkIn,
          checkOut,
          nights,
          totalPrice: unit.totalPrice,
          nightly,
          returnValue: text
        });
        return text;
      }
      // If searched-state but no total, show price fallback (never status)
      if (unit.available && !unit.totalPrice) {
        let text = '';
        if (unit.baseNightly) {
          text = `From $${unit.baseNightly} / night`;
        } else if (unit.nightlyPrice) {
          text = `From $${unit.nightlyPrice} / night`;
        } else {
          text = 'Select dates to see price';
        }
        console.log('[FORMAT PRICE]', unit.id, {
          checkIn,
          checkOut,
          totalPrice: unit.totalPrice,
          nights: unit.nights,
          baseNightly: unit.baseNightly,
          nightlyPrice: unit.nightlyPrice,
          returnValue: text
        });
        return text;
      }
      // Fallback for unavailable or missing data
      if (unit.nightlyPrice) {
        const text = `From $${unit.nightlyPrice} / night`;
        console.log('[CARD SEARCH STATE]', unit.id, text);
        return text;
      }
      const text = 'Select dates to see price & availability';
      console.log('[CARD SEARCH STATE]', unit.id, text);
      return text;
    }

    function formatDateRange(checkIn, checkOut) {
      if (!checkIn || !checkOut) return '';
      const inDate = new Date(checkIn);
      const outDate = new Date(checkOut);
      if (isNaN(inDate) || isNaN(outDate)) return '';
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const inMonth = months[inDate.getMonth()];
      const outMonth = months[outDate.getMonth()];
      const inDay = inDate.getDate();
      const outDay = outDate.getDate();
      if (inMonth === outMonth) {
        return `${inMonth} ${inDay}–${outDay}`;
      } else {
        return `${inMonth} ${inDay} – ${outMonth} ${outDay}`;
      }
    }

    async function fetchAvailability(units, arrival, departure, guests) {
      const results = [];
      let nights = 0;
      if (arrival && departure) {
        const inDate = new Date(arrival);
        const outDate = new Date(departure);
        nights = Math.max(1, Math.round((outDate - inDate) / (1000 * 60 * 60 * 24)));
      }
      for (const unit of units) {
        const params = new URLSearchParams({
          apartmentId: String(unit.id),
          arrival,
          departure
        });
        const url = `https://maravilla-smoobu-proxy.vercel.app/api/smoobu/availability?${params.toString()}`;
        console.log('[SEARCH AVAILABILITY REQUEST]', url);
        try {
          const resp = await fetch(url);
          if (!resp.ok) {
            const errText = await resp.text();
            console.log('[SEARCH AVAILABILITY ERROR BODY]', errText);
            throw new Error(`Availability error: ${resp.status}`);
          }
          const data = await resp.json();
          const available = data?.available ?? data?.isAvailable ?? data?.availability?.available;
          const nightlyPrice = data?.nightlyPrice ?? data?.price ?? data?.availability?.price;
          const totalPrice = data?.totalPrice ?? data?.availability?.totalPrice ?? (nightlyPrice && nights ? nightlyPrice * nights : null);
          results.push({
            ...unit,
            available,
            nightlyPrice,
            totalPrice,
            nights
          });
        } catch {
          results.push({ ...unit, available: false, nightlyPrice: null, totalPrice: null, nights });
        }
      }
      return results;
    }

    function renderCards(section, units, checkIn, checkOut) {
      const grid = section.querySelector('.mv-card-grid');
      grid.innerHTML = units.map(unit => {
        let statusHtml = '';
        let priceHtml = '';
        if (checkIn && checkOut && unit.available) {
          const range = formatDateRange(checkIn, checkOut);
          statusHtml = `<span style='color:#228b22;'>${range}</span>`;
        }
        if (!statusHtml) {
          statusHtml = `<span>Sleeps ${unit.sleeps}</span><span>${unit.tagline}</span>`;
        }
        priceHtml = formatPrice(unit, checkIn, checkOut);
        // Temporary debug log before template return
        console.log('[CARD FINAL]', unit.id, {
          statusHtml,
          priceHtml,
          formattedPrice: formatPrice(unit, checkIn, checkOut)
        });
        return `
        <div class="airbnb-card listing-card"
          data-unit-id="${unit.id}"
          data-title="${unit.name.replace(/^.*?—\s*/, '')}"
          data-image="${unit.img}"
          data-meta="${unit.tagline} · Sleeps ${unit.sleeps}"
          style="${unit.available === false ? 'display:none;' : ''}">
          <div class="mv-card__img-wrapper">
            <img class="mv-card__img" src="${unit.img}" alt="${unit.name}" loading="eager">
            <button class="mv-heart" aria-label="Save">♡</button>
          </div>
          <div class="mv-card__body">

    async function runSearch() {

      console.log('[runSearch] checkOutInput:', checkOutInput);
      console.log('[runSearch] guestsSelect:', guestsSelect);
      const checkIn = checkInInput ? checkInInput.value : '';
      const checkOut = checkOutInput ? checkOutInput.value : '';

      const grouped = groupUnitsByParent(PROPERTIES);
      for (const section of document.querySelectorAll('.mv-section')) {

    modalForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      // Safely read apartmentId from deterministic hidden input
      const apartmentIdInput = document.getElementById('modalApartmentId');
      const apartmentId = apartmentIdInput ? apartmentIdInput.value : '';
      const checkInInput = modalForm.querySelector('input[name="checkin"]');
      const checkOutInput = modalForm.querySelector('input[name="checkout"]');
      const guestsInput = modalForm.querySelector('select[name="guests"]');
      const arrival = checkInInput ? checkInInput.value : '';
      const departure = checkOutInput ? checkOutInput.value : '';
      const guests = guestsInput ? guestsInput.value : '';
      // Stronger validation
      if (!apartmentId) {
        modalResultDiv.innerHTML = `<span style='color:#ff385c;'>Please select a property.</span>`;
        console.log('[MODAL ERROR] Missing apartmentId');
        return;
      }
      if (!arrival || !departure) {
        modalResultDiv.innerHTML = `<span style='color:#ff385c;'>Please select valid dates.</span>`;
        console.log('[MODAL ERROR] Missing arrival/departure');
        return;
      }
      if (new Date(arrival) >= new Date(departure)) {
        modalResultDiv.innerHTML = `<span style='color:#ff385c;'>Check-out must be after check-in.</span>`;
        console.log('[MODAL ERROR] Invalid date range');
        return;
      }
      if (!guests || isNaN(Number(guests)) || Number(guests) < 1) {
        modalResultDiv.innerHTML = `<span style='color:#ff385c;'>Please select number of guests.</span>`;
        console.log('[MODAL ERROR] Invalid guests');
        return;
      }
      try {
        const params = new URLSearchParams({
          apartmentId: String(apartmentId),
          arrival,
          departure
        });
        const url = `${API_BASE}/api/smoobu/availability?${params.toString()}`;
        console.log('[MODAL AVAILABILITY REQUEST]', url);
        const resp = await fetch(url);
        if (!resp.ok) {
          modalResultDiv.innerHTML = `<span style='color:#ff385c;'>Request error. Please try again.</span>`;
          console.log('[MODAL ERROR] Request error');
          return;
        }
        const data = await resp.json();
        const available = data?.available ?? data?.isAvailable ?? data?.availability?.available;
        const nightlyPrice = data?.nightlyPrice ?? data?.price ?? data?.availability?.price;
        const totalPrice = data?.totalPrice ?? data?.availability?.totalPrice;
        // Compact pricing and feedback
        if (available) {
          modalResultDiv.innerHTML = `<span style='color:#228b22;'>Available</span>` +
            (nightlyPrice ? `<br><span style='color:#222;'>Nightly: $${nightlyPrice}</span>` : '') +
            (totalPrice ? `<br><span style='color:#222;'>Total: $${totalPrice}</span>` : '');
        } else if (available === false) {
          modalResultDiv.innerHTML = `<span style='color:#ff385c;'>Unavailable</span>` +
            (nightlyPrice ? `<br><span style='color:#222;'>Nightly: $${nightlyPrice}</span>` : '');
        } else {
          modalResultDiv.innerHTML = `<span style='color:#888;'>Availability status unknown.</span>`;
        }
      } catch (err) {
        modalResultDiv.innerHTML = `<span style='color:#ff385c;'>Request error. Please try again.</span>`;
        console.log('[MODAL ERROR] Exception', err);
      }

          statusHtml,
          priceHtml,
          formattedPrice: formatPrice(unit, checkIn, checkOut)
        });
        return `

          data-title="${unit.name.replace(/^.*?—\s*/, '')}"
          data-image="${unit.img}"
