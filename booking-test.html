<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maraVilla Booking Test</title>
</head>
<body>

<!-- maraVilla Booking Test (Airbnb-lite) — v1.1 UI polish -->

<div id="mv-app" class="mv-app">
    <div class="mv-search">
        <div class="mv-field">
            <label>Check-in</label>
            <input id="mvCheckin" type="date" />
        </div>

        <div class="mv-field">
            <label>Check-out</label>
            <input id="mvCheckout" type="date" />
        </div>

        <div class="mv-field">
            <label>Guests</label>
            <select id="mvGuests">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
        </div>

        <button id="mvSearchBtn" class="mv-btn mv-btn--primary" type="button">Check availability</button>
        <small>No payment required</small>
    </div>
<div id="availabilityStatus" style="margin-top:8px;font-weight:bold;"></div>
<div id="availabilityPrice" style="margin-top:4px;"></div>

    <div class="mv-subrow">
        <div id="mvMsg" class="mv-msg"></div>
        <div class="mv-right">
            <button id="mvShowSaved" class="mv-btn mv-btn--ghost" type="button">Saved</button>
            <button id="mvShowAll" class="mv-btn mv-btn--ghost" type="button">Show all</button>
        </div>
    </div>

    <div class="mv-apartments" aria-live="polite">
        <div class="mv-apartments__title">Apartments</div>
        <div id="mvApartmentsStatus" class="mv-apartments__status"></div>
        <ul id="mvApartmentsList" class="mv-apartments__list"></ul>
    </div>

    <div id="mvResults" class="mv-grid"></div>
</div>

<div id="mvModal" class="mv-modal" aria-hidden="true">
    <div class="mv-modal__backdrop" data-close="1"></div>
    <div class="mv-modal__panel" role="dialog" aria-modal="true" aria-label="Property details">
        <button class="mv-modal__close" data-close="1" aria-label="Done" type="button">✕</button>
        <div id="mvModalContent"></div>
    </div>
</div>

<style>
    .mv-app{
        font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        max-width: 1120px;
        margin: 0 auto;
        padding: 10px 12px;
    }

    .mv-search{
        display: grid;
        grid-template-columns: 1fr 1fr 140px 140px;
        gap: 12px;
        align-items: end;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 18px;
        padding: 12px;
        box-shadow: 0 10px 26px rgba(0,0,0,.06);
    }

    .mv-field label{
        display:block;
        font-size: 12px;
        opacity: .75;
        margin-bottom: 6px;
    }

    .mv-field input, .mv-field select{
        width:100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 14px;
        outline: none;
        background:#fff;
    }
    .mv-field input:focus, .mv-field select:focus{
        border-color: #bdbdbd;
    }

    .mv-btn{
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid #e6e6e6;
        cursor: pointer;
        font-weight: 650;
        background: #fff;
    }

    .mv-btn--primary{
        border: 0;
        background: #ff385c;
        color: #fff;
        opacity: 1;
        cursor: pointer;
        box-shadow: 0 10px 26px rgba(255,56,92,.18);
        transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .mv-btn--primary:hover{
        transform: translateY(-1px);
        box-shadow: 0 14px 34px rgba(255,56,92,.26);
        filter: brightness(1.02);
    }

    @media(min-width: 1024px){
        .mv-search{
            padding: 14px 12px;
            gap: 10px;
        }
        .mv-btn--primary{
            padding: 12px 16px;
        }
    }

    @media(min-width: 1024px){
        .mv-subrow{
            align-items: baseline;
            margin: 8px 4px 8px 4px;
        }
    }

    .mv-btn--ghost{
        background: #fff;
        transition: transform .12s ease;
    }
    .mv-btn--ghost:hover{ transform: translateY(-1px); }
    .mv-btn--ghost.is-active{
        border-color: #ffd6de;
        background: #fff5f7;
    }

    .mv-subrow{
        display:flex;
        justify-content: space-between;
        align-items: center;
        margin: 10px 4px 0 4px;
        gap: 10px;
    }
    .mv-msg{
        font-size: 13px;
        opacity: .8;
    }
    .mv-right{ display:flex; gap:8px; }

    .mv-grid{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 14px;
    }
    .mv-apartments{
        margin-top: 12px;
        padding: 12px;
        border: 1px solid #eee;
        border-radius: 14px;
        background: #fff;
    }
    .mv-apartments__title{
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
    }
    .mv-apartments__status{
        font-size: 12px;
        opacity: .75;
        margin-bottom: 6px;
    }
    .mv-apartments__list{
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 6px;
        font-size: 13px;
    }
    .mv-apartments__list li{
        padding: 6px 8px;
        border: 1px solid #f0f0f0;
        border-radius: 10px;
        background: #fafafa;
    }
    .mv-apartments__group{
        background: transparent;
        border: 0;
        padding: 6px 0 2px 0;
        font-weight: 700;
        opacity: .8;
        pointer-events: none;
    }
    .mv-selected{
        outline: 2px solid #ff385c;
        outline-offset: 2px;
    }
    @media(max-width: 980px){
        .mv-search{ grid-template-columns: 1fr 1fr; }
        .mv-grid{ grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 768px){
        .mv-search{
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 10px;
        }
        .mv-btn--primary{ width: 100%; }
        .mv-grid{ grid-template-columns: 1fr; gap: 20px; }
        .mv-card__body{ line-height: 1.45; }
        .mv-card__meta, .mv-card__tag{ line-height: 1.35; }
        .mv-heart{
            min-width: 44px;
            min-height: 44px;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 13px;
            line-height: 1;
            background: transparent;
            border: 0;
            box-shadow: none;
            position: relative;
            z-index: 0;
            opacity: 1;
            color: #111;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mv-heart::before{
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: rgba(255,255,255,.85);
            border: 1px solid #eee;
            transform: translate(-50%, -50%);
            z-index: -1;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
            pointer-events: none;
        }
        .mv-subrow{ margin-top: 12px; }
    }
    @media(max-width: 640px){
        .mv-grid{ grid-template-columns: 1fr; }
    }

    @media(min-width: 1024px){
        .mv-card__title{ font-size: 17px; font-weight: 780; margin: 2px 0 8px 0; }
        .mv-card__meta{ font-size: 12px; opacity: .68; gap: 8px; }
        .mv-card__tag{ margin-top: 4px; }
    }

    .mv-card{
        border: 1px solid #eee;
        border-radius: 18px;
        overflow:hidden;
        background:#fff;
        box-shadow: 0 10px 26px rgba(0,0,0,.06);
        cursor:pointer;
        position:relative;
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .mv-card.is-unavailable{
        opacity: .6;
    }
    .mv-card.is-unavailable .mv-heart{
        pointer-events: none;
    }
    .mv-card.is-unavailable .mv-card__meta span:last-child{
        display: none;
    }
    .mv-card.is-unavailable .mv-card__meta::after{
        content: "Unavailable for selected dates";
        font-size: 13px;
        opacity: .78;
    }
    .mv-card:hover{
        transform: translateY(-2px);
        box-shadow: 0 14px 34px rgba(0,0,0,.12);
    }

    .mv-card img{
        width:100%;
        height: 190px;
        object-fit: cover;
        display:block;
        background:#f3f3f3;
    }

    .mv-card__body{ padding: 12px; }
    .mv-card__title{ font-weight: 750; margin: 0 0 6px 0; }
    .mv-card__meta{ font-size: 13px; opacity: .78; display:flex; justify-content:space-between; gap:10px; }
    .mv-card__tag{ font-size: 12px; opacity:.7; margin-top: 6px; }

    .mv-heart{
        position:absolute;
        top: 10px;
        right: 10px;
        background: rgba(255,255,255,.92);
        border: 1px solid #eee;
        border-radius: 999px;
        padding: 7px 10px;
        cursor:pointer;
        user-select:none;
    }
    .mv-heart[data-on="1"]{ border-color:#ff385c; }
    .mv-heart.is-saved{ color: #ff385c; }
    .mv-heart.is-pulse{
        animation: mv-heart-pop .16s ease-out;
    }
    @keyframes mv-heart-pop{
        0%{ transform: scale(1); }
        60%{ transform: scale(1.08); }
        100%{ transform: scale(1); }
    }

    @media(max-width: 768px){
        .mv-heart{
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
    }

    .mv-modal{ position:fixed; inset:0; display:none; z-index:9999; }
    .mv-modal[aria-hidden="false"]{ display:block; }
    .mv-modal__backdrop{ position:absolute; inset:0; background: rgba(0,0,0,.55); }
    .mv-modal__panel{
        position:relative;
        max-width: 920px;
        margin: 6vh auto;
        background:#fff;
        border-radius: 18px;
        overflow:hidden;
    }
    .mv-modal__close{
        position:absolute;
        top: 10px;
        right: 10px;
        border: 1px solid #eee;
        background: rgba(255,255,255,.95);
        border-radius: 12px;
        padding: 8px 10px;
        cursor:pointer;
        z-index:3;
    }
    .mv-modal__content{
        display:grid;
        grid-template-columns: 1.2fr .8fr;
        gap: 0;
    }
    @media(max-width: 820px){
        .mv-modal__content{ grid-template-columns: 1fr; }
    }
    .mv-modal__img{
        width:100%;
        height: 420px;
        object-fit: cover;
        background:#f3f3f3;
    }
    .mv-modal__side{
        padding: 16px;
        border-left: 1px solid #f0f0f0;
    }
    @media(max-width: 820px){
        .mv-modal__side{ border-left:0; border-top:1px solid #f0f0f0; }
    }
    @media(max-width: 768px){
        .mv-modal__panel{ max-height: 90vh; overflow: hidden; }
        .mv-modal__side{ padding: 12px; overflow: auto; }
        .mv-modal__close{ opacity: .7; }
    }
    .mv-pill{
        display:inline-block;
        padding: 6px 10px;
        border: 1px solid #eee;
        border-radius: 999px;
        font-size: 12px;
        opacity: .85;
        margin-right: 6px;
        margin-bottom: 6px;
        background:#fff;
    }
    .mv-actions{ display:grid; gap:10px; margin-top: 12px; }
    .mv-link{
        display:inline-block;
        font-size: 13px;
        opacity:.85;
        margin-top: 8px;
    }
</style>

<script>
(() => {
    const CONFIG = {
        defaultGuests: 2,
        sameDayCheckin: false,
        favoritesKey: "mv_saved"
    };
    const API_BASE = "https://maravilla-smoobu-proxy.vercel.app";

    const PROPERTIES = [
        {
            id: 3155581,
            name: "Casa Victoria — Villa A",
            sleeps: 6,
            tagline: "2BR • 2 Bath • 1.5 blocks to the beach",
            img: "https://images.squarespace-cdn.com/content/v1/56c4c3281bbee0fde9e882cf/1726259424715-7Q01O05WF5VTOAGY4PFX/Casa%2BVictoria%2B-%2BApartment%2BD%2B008.jpg",
            url: "https://www.maravillanayarit.com/patio-villa-a"
        },
        {
            id: 3155591,
            name: "Casa Victoria — Villa C",
            sleeps: 6,
            tagline: "2BR • 2 Bath • Private balcony",
            img: "https://images.squarespace-cdn.com/content/v1/56c4c3281bbee0fde9e882cf/1639429044647-Q73Y374R2VURECZ1SGM9/PDP03935.jpg",
            url: "https://www.maravillanayarit.com/unit-c-upper"
        },
        {
            id: 3155586,
            name: "Casa Victoria — Villa D",
            sleeps: 6,
            tagline: "2BR • 2 Bath • Upper unit",
            img: "https://images.squarespace-cdn.com/content/v1/56c4c3281bbee0fde9e882cf/1639429152074-QH8ZZ2TNPNALMPDN3W8A/PDP03786.jpg",
            url: "https://www.maravillanayarit.com/unit-d-upper"
        },
        {
            id: 3155576,
            name: "Vista Victoria — Town House #1",
            sleeps: 8,
            tagline: "Townhome • Great for families",
            img: "https://images.squarespace-cdn.com/content/v1/56c4c3281bbee0fde9e882cf/1618930764543-DE7D7M9F3PWYIDWR51PK/DSC08761sm.jpg",
            url: "https://www.maravillanayarit.com/vista-victoria-town-house-1"
        }
    ];

    const $ = (id) => document.getElementById(id);
    const $results = $("mvResults");
    const $msg = $("mvMsg");
    const $searchBtn = $("mvSearchBtn");
    const $showSaved = $("mvShowSaved");
    const $showAll = $("mvShowAll");
    const $modal = $("mvModal");
    const $modalContent = $("mvModalContent");
    const $apartmentsStatus = $("mvApartmentsStatus");
    const $apartmentsList = $("mvApartmentsList");
    const $availabilityStatus = $("availabilityStatus");
    const $availabilityPrice = $("availabilityPrice");
    let savedFilterActive = false;
    let currentList = PROPERTIES;
    let selectedPropertyId = "";

    const getFavs = () => new Set(JSON.parse(localStorage.getItem(CONFIG.favoritesKey) || "[]").map(String));
    const setFavs = (set) => localStorage.setItem(CONFIG.favoritesKey, JSON.stringify([...set]));
    const fmtDate = (d) => d ? d : "—";

    const getApartmentId = (apartment) => String(
        apartment?.id ?? apartment?.apartmentId ?? apartment?.apartment_id ?? ""
    );
    const getParentPointer = (apartment) => {
        const candidates = [
            apartment?.parentId,
            apartment?.parent_id,
            apartment?.parentApartmentId,
            apartment?.parent_apartment_id,
            apartment?.parentPropertyId,
            apartment?.parent_property_id,
            apartment?.groupId,
            apartment?.group_id,
            apartment?.propertyGroupId,
            apartment?.property_group_id
        ];
        const found = candidates.find((value) => value !== null && value !== undefined && value !== "");
        return found == null ? "" : String(found);
    };
    const isParentApartment = (apartment) => Boolean(
        apartment?.isParent ||
        apartment?.is_parent ||
        apartment?.isGroup ||
        apartment?.is_group ||
        apartment?.isParentProperty ||
        apartment?.is_parent_property ||
        (Array.isArray(apartment?.children) && apartment.children.length) ||
        (Array.isArray(apartment?.units) && apartment.units.length)
    );
    const getParentKey = (apartment) => {
        const parentPointer = getParentPointer(apartment);
        if (parentPointer) return parentPointer;
        if (isParentApartment(apartment)) return getApartmentId(apartment);
        return "Ungrouped";
    };

    const toSlug = (value) => String(value)
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

    const getPropertyId = (p) => p.slug || toSlug(p.name);

    function normalizeSavedIds() {
        const raw = JSON.parse(localStorage.getItem(CONFIG.favoritesKey) || "[]").map(String);
        const normalized = raw.map((id) => {
            const match = PROPERTIES.find((p) => String(p.id) === id);
            return match ? getPropertyId(match) : id;
        });
        const unique = [...new Set(normalized)];
        localStorage.setItem(CONFIG.favoritesKey, JSON.stringify(unique));
    }

    async function loadApartments() {
        $apartmentsStatus.textContent = "Loading apartments...";
        $apartmentsList.innerHTML = "";
        try {
            const response = await fetch("https://maravilla-smoobu-proxy.vercel.app/api/smoobu/apartments", {
                method: "GET"
            });
            if (!response.ok) {
                throw new Error(`Smoobu proxy error: ${response.status}`);
            }
            const data = await response.json();
            const apartments = Array.isArray(data?.apartments) ? data.apartments : [];
            console.log("apartments sample", apartments.slice(0,3));
            console.log("apartment keys", Object.keys(apartments[0] || {}));
            if (!data?.ok) {
                throw new Error("Smoobu proxy returned ok=false");
            }
            if (!apartments.length) {
                $apartmentsStatus.textContent = "No apartments returned.";
                return;
            }
            const availabilityById = window.mvAvailabilityById || {};
            const parentCandidates = apartments.filter((apartment) =>
                apartments.some((other) => other !== apartment && other?.name?.startsWith(`${apartment.name} `))
            );
            const parentNames = new Set(parentCandidates.map((apartment) => apartment.name));
            const groups = new Map();

            apartments.forEach((apartment) => {
                const name = apartment?.name || "";
                if (parentNames.has(name)) return;
                const parentMatch = parentCandidates.find((candidate) => name.startsWith(`${candidate.name} `));
                const parentName = parentMatch ? parentMatch.name : "Other";
                if (!groups.has(parentName)) groups.set(parentName, []);
                const availability = availabilityById[getApartmentId(apartment)];
                if (availability?.available === false) return;
                groups.get(parentName).push(apartment);
            });

            const orderedParents = [...new Set(parentCandidates.map((apartment) => apartment.name))]
                .sort((a, b) => a.localeCompare(b));
            const otherChildren = groups.get("Other") || [];

            const propertyCount = orderedParents.filter((name) => (groups.get(name) || []).length).length;
            const unitCount = [...groups.values()].reduce((sum, children) => sum + children.length, 0);
            $apartmentsStatus.textContent = `${propertyCount} properties • ${unitCount} units`;

            $apartmentsList.innerHTML = orderedParents.map((parentName) => {
                const children = groups.get(parentName) || [];
                if (!children.length) return "";
                const header = `<li class="mv-apartments__group">${parentName}</li>`;
                const childItems = children.map((apartment) => {
                    const id = getApartmentId(apartment);
                    const name = apartment.name || `Apartment ${id}`;
                    return `<li data-apartment-id="${id}">${name}</li>`;
                }).join("");
                return `${header}${childItems}`;
            }).join("") + (otherChildren.length ? `<li class="mv-apartments__group">Other</li>${otherChildren.map((apartment) => {
                const id = getApartmentId(apartment);
                const name = apartment.name || `Apartment ${id}`;
                return `<li data-apartment-id="${id}">${name}</li>`;
            }).join("")}` : "");
        } catch (err) {
            $apartmentsStatus.textContent = "Unable to load apartments right now.";
            console.error("Failed to load Smoobu apartments:", err);
        }
    }

    normalizeSavedIds();
    loadApartments();

    function todayISO() {
        const t = new Date();
        t.setHours(0,0,0,0);
        return t.toISOString().slice(0,10);
    }

    function setMinDates() {
        const checkin = $("mvCheckin");
        const checkout = $("mvCheckout");
        const minIn = CONFIG.sameDayCheckin ? todayISO() : (() => {
            const t = new Date(); t.setDate(t.getDate()+1);
            return t.toISOString().slice(0,10);
        })();
        checkin.min = minIn;
        checkout.min = minIn;
    }

    function ensureCheckoutAfterCheckin() {
        const inVal = $("mvCheckin").value;
        const outVal = $("mvCheckout").value;
        if (!inVal) return;
        const inDate = new Date(inVal + "T00:00:00");
        const minOut = new Date(inDate); minOut.setDate(minOut.getDate()+1);
        const minOutISO = minOut.toISOString().slice(0,10);
        $("mvCheckout").min = minOutISO;

        if (outVal && outVal <= inVal) {
            $("mvCheckout").value = minOutISO;
        }
    }

    function ensureSelectedPropertyId(list) {
        if (!list.length) {
            selectedPropertyId = "";
            return;
        }
        const ids = new Set(list.map((p) => getPropertyId(p)));
        if (!selectedPropertyId || !ids.has(selectedPropertyId)) {
            selectedPropertyId = getPropertyId(list[0]);
        }
    }

    function renderCards(list) {
        ensureSelectedPropertyId(list);
        const favs = getFavs();
        $results.innerHTML = list.map(p => `
            <div class="mv-card" data-id="${p.id}" data-property-id="${getPropertyId(p)}" data-apartment-id="${p.id}">
                <div class="mv-heart${favs.has(getPropertyId(p)) ? " is-saved" : ""}" data-heart="1" data-id="${p.id}" data-property-id="${getPropertyId(p)}" data-on="${favs.has(getPropertyId(p)) ? 1 : 0}">
                    ${favs.has(getPropertyId(p)) ? "♥" : "♡"}
                </div>
                <img src="${p.img}" alt="${p.name}" loading="eager"
                         onerror="this.onerror=null;this.style.opacity=0.7;this.style.filter='grayscale(1)';">
                <div class="mv-card__body">
                    <div class="mv-card__title">${p.name}</div>
                    <div class="mv-card__meta">
                        <span>Sleeps ${p.sleeps}</span>
                        <span>Select dates to see price &amp; availability</span>
                    </div>
                    <div class="mv-card__tag">${p.tagline || ""}</div>
                </div>
            </div>
        `).join("");
    }

    function updateSavedCount(isActive = false) {
        const count = getFavs().size;
        $showSaved.textContent = `Saved (${count})`;
        $showSaved.classList.toggle("is-active", isActive);
        $showAll.classList.toggle("is-active", !isActive);
    }

    function renderWithFilters() {
        if (!savedFilterActive) {
            renderCards(currentList);
            const count = currentList.length;
            $msg.textContent = count
                ? `${count} option${count===1?"":"s"} shown.`
                : "No properties available for these dates.";
            return;
        }

        const favs = getFavs();
        const saved = currentList.filter(p => favs.has(getPropertyId(p)));
        renderCards(saved);
        const count = saved.length;
        $msg.textContent = count
            ? `${count} saved propert${count===1?"y":"ies"} shown.`
            : "No saved properties yet";
    }

    function openModal(p) {
        const checkin = $("mvCheckin").value;
        const checkout = $("mvCheckout").value;
        const guests = $("mvGuests").value;

        $modalContent.innerHTML = `
            <div class="mv-modal__content">
                <div>
                    <img class="mv-modal__img" src="${p.img}" alt="${p.name}" loading="eager"
                             onerror="this.onerror=null;this.style.opacity=0.7;this.style.filter='grayscale(1)';">
                </div>
                <div class="mv-modal__side">
                    <h2 style="margin:0 0 6px 0; font-weight:800;">${p.name}</h2>
                    <div style="opacity:.8; margin-bottom:8px;">${p.tagline || ""}</div>

                    <div>
                        <span class="mv-pill">Sleeps ${p.sleeps}</span>
                        <span class="mv-pill">${guests} guests</span>
                        <span class="mv-pill">${fmtDate(checkin)} → ${fmtDate(checkout)}</span>
                    </div>

                    <div style="margin-top:10px; font-size:13px; opacity:.8;">
                        Prototype: next step is live availability + pricing via Smoobu API (backend).
                    </div>

                    <div class="mv-actions">
                        <button id="mvReserveBtn" class="mv-btn mv-btn--primary" type="button">Check availability</button>
                        <small>No payment required</small>
                        <button class="mv-btn mv-btn--ghost" data-close="1" type="button">Done</button>
                    </div>

                    <a class="mv-link" href="${p.url}" target="_blank" rel="noopener">Open full property page →</a>
                </div>
            </div>
        `;

        $("mvReserveBtn").addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            checkAvailability();
        });

        $modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
        $modal.setAttribute("aria-hidden", "true");
    }

    async function checkAvailability() {
        const checkIn = $("mvCheckin").value;
        const checkOut = $("mvCheckout").value;
        const guests = $("mvGuests").value;
        const apartmentId = window.mvSelectedApartmentId;

        if (!apartmentId) {
            $availabilityStatus.textContent = "Select an apartment first.";
            $availabilityPrice.textContent = "";
            return;
        }
        if (!checkIn || !checkOut) {
            $availabilityStatus.textContent = "Select check-in and check-out dates.";
            $availabilityPrice.textContent = "";
            return;
        }

        $availabilityStatus.textContent = "Checking availability...";
        $availabilityPrice.textContent = "";

        try {
            const params = new URLSearchParams({
                apartmentId: String(apartmentId),
                checkIn,
                checkOut,
                guests: String(guests),
            });
            console.log("[availability params]", { apartmentId, checkIn, checkOut, guests });
            const response = await fetch(`https://maravilla-smoobu-proxy.vercel.app/api/smoobu/availability?${params.toString()}`);
            if (!response.ok) {
                const errText = await response.text();
                console.error("[availability error]", response.status, errText);
                throw new Error(`Availability error: ${response.status}`);
            }
            const data = await response.json();
            const available = data?.available ?? data?.isAvailable ?? data?.availability?.available;
            const price = data?.price ?? data?.nightlyPrice ?? data?.availability?.price;

            if (available === true) {
                $availabilityStatus.textContent = "Available";
            } else if (available === false) {
                $availabilityStatus.textContent = "Unavailable";
            } else {
                $availabilityStatus.textContent = "Availability status unknown.";
            }

            if (price != null && price !== "") {
                $availabilityPrice.textContent = `Nightly price: ${price}`;
            }
        } catch (err) {
            $availabilityStatus.textContent = "Unable to check availability right now.";
            $availabilityPrice.textContent = "";
            console.error("Failed to check availability:", err);
        }
    }

    function runSearch() {
        const guests = parseInt($("mvGuests").value, 10);
        currentList = PROPERTIES.filter(p => p.sleeps >= guests);
        renderWithFilters();
    }

    $searchBtn.addEventListener("click", async () => {
        if ($searchBtn.disabled) return;
        const originalLabel = $searchBtn.textContent;
        $searchBtn.disabled = true;
        $searchBtn.textContent = "Checking...";
        runSearch();

        const checkIn = $("mvCheckin").value;
        const checkOut = $("mvCheckout").value;
        const guests = $("mvGuests").value;
        const availabilityById = window.mvAvailabilityById || {};
        window.mvAvailabilityById = availabilityById;
        const cards = Array.from($results.querySelectorAll(".mv-card"));

        for (const card of cards) {
            const apartmentId = card.dataset.apartmentId;
            if (!apartmentId) {
                card.style.display = "none";
                continue;
            }

            try {
                const params = new URLSearchParams({
                    apartmentId: String(apartmentId),
                    checkIn,
                    checkOut,
                    guests: String(guests)
                });
                const resp = await fetch(`${API_BASE}/api/smoobu/availability?${params.toString()}`);
                if (!resp.ok) {
                    const errText = await resp.text();
                    console.error("[availability error]", resp.status, errText);
                    throw new Error(`Availability error: ${resp.status}`);
                }
                const data = await resp.json();
                const available = data?.available ?? data?.isAvailable ?? data?.availability?.available;
                const nightlyPrice = data?.nightlyPrice ?? data?.price ?? data?.availability?.price;

                console.log("[availability result]", { apartmentId, available, nightlyPrice });
                availabilityById[apartmentId] = { available, nightlyPrice };

                if (available === true) {
                    card.style.display = "";
                    const subtitle = card.querySelector(".mv-card__meta span:last-child");
                    if (subtitle) {
                        const priceText = nightlyPrice != null && nightlyPrice !== "" ? nightlyPrice : "—";
                        subtitle.textContent = `Nightly price: ${priceText}`;
                    }
                    const listItem = $apartmentsList.querySelector(`[data-apartment-id="${apartmentId}"]`);
                    if (listItem) listItem.style.display = "";
                } else {
                    card.style.display = "none";
                    const listItem = $apartmentsList.querySelector(`[data-apartment-id="${apartmentId}"]`);
                    if (listItem) listItem.style.display = "none";
                }
            } catch (err) {
                card.style.display = "none";
                const listItem = $apartmentsList.querySelector(`[data-apartment-id="${apartmentId}"]`);
                if (listItem) listItem.style.display = "none";
                availabilityById[apartmentId] = { available: false };
                console.error("Failed to check availability:", err);
            }
        }

        cards.forEach((card) => {
            const apartmentId = card.dataset.apartmentId;
            const result = availabilityById[apartmentId];
            if (result?.available === false) {
                card.style.display = "none";
            }
            if (result?.available === true) {
                card.style.display = "";
            }
        });

        $apartmentsList.querySelectorAll(".mv-apartments__group").forEach((header) => {
            let next = header.nextElementSibling;
            let hasVisible = false;
            while (next && !next.classList.contains("mv-apartments__group")) {
                if (next.style.display !== "none") {
                    hasVisible = true;
                    break;
                }
                next = next.nextElementSibling;
            }
            header.style.display = hasVisible ? "" : "none";
        });

        $searchBtn.disabled = false;
        $searchBtn.textContent = originalLabel;
    });
    $showSaved.addEventListener("click", () => {
        savedFilterActive = true;
        renderWithFilters();
        updateSavedCount(true);
    });
    $showAll.addEventListener("click", () => {
        savedFilterActive = false;
        renderWithFilters();
        updateSavedCount(false);
    });

    $("mvCheckin").addEventListener("change", () => { ensureCheckoutAfterCheckin(); runSearch(); });
    $("mvCheckout").addEventListener("change", runSearch);
    $("mvGuests").addEventListener("change", runSearch);

    $results.addEventListener("click", (e) => {
        const innerAction = e.target.closest("button, a");
        if (innerAction && e.target.closest(".mv-card")) {
            e.preventDefault();
            e.stopPropagation();
            return;
        }
        const heart = e.target.closest("[data-heart]");
        if (heart) {
            e.preventDefault(); e.stopPropagation();
            const id = String(heart.dataset.propertyId || heart.dataset.id);
            const favs = getFavs();
            if (favs.has(id)) favs.delete(id); else favs.add(id);
            setFavs(favs);
            heart.dataset.on = favs.has(id) ? "1" : "0";
            heart.textContent = favs.has(id) ? "♥" : "♡";
            heart.classList.toggle("is-saved", favs.has(id));
            heart.classList.remove("is-pulse");
            void heart.offsetWidth;
            heart.classList.add("is-pulse");
            updateSavedCount($showSaved.classList.contains("is-active"));
            if (savedFilterActive) renderWithFilters();
            return;
        }

        const card = e.target.closest(".mv-card");
        if (!card) return;
        const id = String(card.dataset.propertyId || card.dataset.id);
        const p = PROPERTIES.find(x => getPropertyId(x) === id || String(x.id) === id);
        if (p) {
            const apartmentId = card.dataset.apartmentId || p.id;
            window.mvSelectedApartmentId = String(apartmentId);
            document.querySelectorAll(".mv-selected").forEach((el) => el.classList.remove("mv-selected"));
            card.classList.add("mv-selected");
            openModal(p);
        }
    });

    $apartmentsList.addEventListener("click", (e) => {
        const item = e.target.closest("[data-apartment-id]");
        if (!item) return;
        window.mvSelectedApartmentId = String(item.dataset.apartmentId);
        document.querySelectorAll(".mv-selected").forEach((el) => el.classList.remove("mv-selected"));
        item.classList.add("mv-selected");
    });

    $modal.addEventListener("click", (e) => {
        if (e.target.dataset.close) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
    });

    $("mvGuests").value = String(CONFIG.defaultGuests);
    setMinDates();
    ensureCheckoutAfterCheckin();
    currentList = PROPERTIES;
    renderWithFilters();
    updateSavedCount(false);
})();
</script>

</body>
</html>
